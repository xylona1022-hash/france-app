<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法文學習">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E4A7D">
<title>法文學習 App</title>

<style>
:root{
  --primary:#2E4A7D; --primary-light:#4472C4; --accent:#C00000;
  --bg:#F5F6FA; --card:#FFFFFF; --text:#1B1F27; --muted:#6B7280;
  --good:#1E8E5A; --bad:#D33; --border:#E4E7EC;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",Arial,sans-serif;}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
.topbar{background:var(--primary); color:#fff; padding:calc(10px + var(--safe-top)) 16px 12px;
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
.topbar h1{font-size:17px; margin:0; font-weight:700;}
.topbar .sub{font-size:11px; opacity:.75; margin-top:2px;}
.icon-btn{background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;}
.view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 20px;}
.view.hidden{display:none;}
nav.tabbar{display:flex; background:#fff; border-top:1px solid var(--border); padding-bottom: var(--safe-bottom); flex-shrink:0;}
nav.tabbar button{flex:1; background:none; border:none; padding:8px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10.5px; font-family:inherit;}
nav.tabbar button .ic{font-size:20px;}
nav.tabbar button.active{color:var(--primary-light); font-weight:700;}
.card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
h2.section-title{font-size:15px; margin:4px 0 10px; color:var(--primary); font-weight:800;}
.btn{border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
.btn-primary{background:var(--primary-light); color:#fff;}
.btn-outline{background:#fff; border:1.5px solid var(--primary-light); color:var(--primary-light);}
.btn-ghost{background:var(--bg); color:var(--text);}
.btn-good{background:var(--good); color:#fff;}
.btn-bad{background:var(--bad); color:#fff;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
select, input[type=text], textarea{width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px; font-size:14px; font-family:inherit; background:#fff; color:var(--text);}
textarea{resize:vertical;}
label.field-label{font-size:12px; color:var(--muted); font-weight:700; margin:10px 0 4px; display:block;}
.chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.chip{background:#fff; border:1.5px solid var(--border); border-radius:20px; padding:6px 12px; font-size:12.5px; color:var(--muted); cursor:pointer;}
.chip.active{background:var(--primary-light); border-color:var(--primary-light); color:#fff; font-weight:700;}
.empty-hint{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}
.fab{position:fixed; right:16px; bottom:calc(78px + var(--safe-bottom)); width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 4px 10px rgba(0,0,0,.25); z-index:20;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50;}
.modal-bg.hidden{display:none;}
.modal{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + var(--safe-bottom));}
.modal h3{margin:0 0 10px; font-size:16px; color:var(--primary);}
.modal-close{float:right; background:none; border:none; font-size:20px; color:var(--muted);}
.flash-wrap{display:flex; flex-direction:column; align-items:center;}
.flash-progress{font-size:12px; color:var(--muted); margin-bottom:8px;}
.flashcard{width:100%; max-width:420px; min-height:230px; border-radius:18px; background:linear-gradient(160deg,#4472C4,#2E4A7D); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 18px; text-align:center; box-shadow:0 6px 18px rgba(46,74,125,.35); position:relative; cursor:pointer;}
.flashcard .pos-tag{position:absolute; top:12px; left:14px; font-size:11px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:20px;}
.flashcard .fr-word{font-size:27px; font-weight:800; line-height:1.3;}
.flashcard .back{margin-top:14px; font-size:15px; line-height:1.6;}
.flashcard .example{margin-top:12px; font-size:12.5px; font-style:italic; opacity:.85; border-top:1px solid rgba(255,255,255,.3); padding-top:10px;}
.flashcard .flip-hint{position:absolute; bottom:10px; font-size:10.5px; opacity:.65;}
.flash-actions,.flash-audio-row{display:flex; gap:10px; width:100%; max-width:420px; margin-top:14px;}
.flash-actions .btn{flex:1; padding:13px;}
.flash-audio-row .btn{flex:1; padding:11px; font-size:13px;}
.flash-audio-row .btn.listening{background:var(--accent); color:#fff; border-color:var(--accent);}
.flash-nav{display:flex; gap:14px; margin-top:14px; align-items:center;}
.flash-nav button{background:none; border:none; font-size:22px; color:var(--primary-light); cursor:pointer;}
.practice-word{font-size:24px; font-weight:800; color:var(--primary); text-align:center; margin:6px 0 4px;}
.practice-meaning{text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px;}
.blank-display{text-align:center; font-size:22px; letter-spacing:3px; font-weight:700; color:var(--primary); margin:12px 0;}
.feedback{border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:10px;}
.feedback.ok{background:#E3F5EC; color:var(--good);}
.feedback.no{background:#FCE8E8; color:var(--bad);}
.speaker-btn{display:block; margin:0 auto 14px; background:var(--primary-light); color:#fff; border:none; width:64px; height:64px; border-radius:50%; font-size:26px; cursor:pointer;}
.article-item{background:#fff; border-radius:12px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer;}
.article-item .t{font-weight:700; font-size:14.5px;}
.article-item .meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.article-body{background:#fff; border-radius:14px; padding:16px; font-size:15.5px; line-height:1.9; margin-bottom:14px; white-space:pre-wrap;}
.sel-panel{background:#FFF8E6; border:1.5px dashed #E0B84A; border-radius:12px; padding:10px 12px; margin-bottom:14px; font-size:13px;}
.note-item{background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.note-item .quote{font-size:12.5px; color:var(--primary-light); font-style:italic; border-left:3px solid var(--primary-light); padding-left:8px; margin-bottom:5px;}
.note-item .txt{font-size:13.5px;}
.note-item .del{float:right; color:var(--bad); font-size:12px; background:none; border:none;}
.quiz-q{font-size:20px; font-weight:800; text-align:center; margin:10px 0 20px; color:var(--primary); line-height:1.5;}
.quiz-opt{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px; font-size:14.5px; cursor:pointer; font-family:inherit;}
.quiz-opt .letter{display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--bg); text-align:center; line-height:22px; font-size:12px; font-weight:700; margin-right:8px; color:var(--muted);}
.quiz-opt.correct{background:#E3F5EC; border-color:var(--good);}
.quiz-opt.wrong{background:#FCE8E8; border-color:var(--bad);}
.quiz-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;}
.quiz-explain{background:var(--bg); border-radius:10px; padding:10px 12px; font-size:13px; margin-top:8px; color:var(--muted);}
.result-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat-box{background:#fff; border-radius:12px; padding:14px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat-box .num{font-size:24px; font-weight:800; color:var(--primary-light);}
.stat-box .lbl{font-size:11.5px; color:var(--muted); margin-top:2px;}
.tag-row{display:flex; align-items:center; gap:6px; padding:9px 0; border-bottom:1px solid var(--border);}
.toast{position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom)); transform:translateX(-50%); background:rgba(30,30,30,.9); color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; z-index:99; max-width:86%; text-align:center; white-space:pre-line;}
.fab.fab-secondary{bottom:calc(140px + var(--safe-bottom)); background:var(--primary-light); font-size:20px;}
.demo-banner{background:#FFF3CD; color:#7A5A00; font-size:11.5px; text-align:center; padding:5px 8px; flex-shrink:0;}
</style>
</head>

  LS.set('fr_customVocab', customVocab); LS.set('fr_customArticles', customArticles);

  LS.set('fr_quizHistory', quizHistory); LS.set('fr_prefs', prefs);

if(!prefs.tagsInit){
  ['片語', CAT_WORD, CAT_SENT].forEach(c=>{ if(!pinnedCategories.includes(c)) pinnedCategories.push(c); });
  prefs.tagsInit = true; saveAll();
}
function allVocab(){
  return [...VOCAB_DEFAULT, ...customVocab].map(w => { return {...w, cat: wordCategoryOverrides[w.id] || w.cat}; }).filter(w => !deletedCategories.includes(w.cat) && !(prefs.delIds && prefs.delIds[w.id]));
}
function allArticles(){
  return [...ARTICLES_DEFAULT, ...LINKS_DEFAULT, ...customArticles].map(a => ({...a, folder: articleFolderOverrides[a.id] || a.folder || '我的文章'})).filter(a => !deletedFolders.includes(a.folder));
}
function allArticleFolders(){
  return [...new Set([...allArticles().map(a=>a.folder), ...articleFolders])].filter(f => !deletedFolders.includes(f));
}
function allPoolForPractice(source){
  if(source==='vocab') return allVocab().map(x=>({...x, kind:'vocab'}));
  if(source==='verb') return [...VERB_DEFAULT.map(x=>({...x, kind:'verb'})), ...GRAMMAR_DEFAULT.map(x=>({...x, kind:'grammar'}))];
  return [...allVocab().map(x=>({...x, kind:'vocab'})), ...VERB_DEFAULT.map(x=>({...x, kind:'verb'})), ...GRAMMAR_DEFAULT.map(x=>({...x, kind:'grammar'}))];
}
function allCategories(){
  return [...new Set([...allVocab().map(x=>x.cat), ...pinnedCategories])].filter(c => !deletedCategories.includes(c));
}

  const old=document.getElementById('toastEl'); if(old) old.remove();
  const t=document.createElement('div'); t.id='toastEl'; t.className='toast'; t.textContent=msg;
  document.getElementById('app').appendChild(t); setTimeout(()=>{ t.remove(); }, 2600);
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalizeStr(s, ignoreAccents){
  s = (s||'').trim().toLowerCase();
  s = s.replace(/[.。,，!！?？;；:：]/g, '').replace(/\s+/g, ' ').trim();
  if(ignoreAccents) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s;
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
  return dp[m][n];
}
function similarity(a,b){ return 1 - levenshtein(a,b)/Math.max(a.length, b.length, 1); }

function flipCard(){ cardState.flipped = !cardState.flipped; renderCards(); }
function stepCard(dir){
  if(cardState.pool.length===0) return;
  cardState.idx = (cardState.idx + dir + cardState.pool.length) % cardState.pool.length;
  cardState.flipped = false; renderCards();
}
function gradeCard(good){
  const w = cardState.pool[cardState.idx]; if(!w) return;
  const p = progress[w.id] || {box:1, seen:0, correct:0, wrong:0};
  p.seen++;
  if(good){ p.correct++; p.box = Math.min(5, p.box+1); } else { p.wrong++; p.box = 1; }
  const intervals = [0,1,3,7,16,30];
  const d = new Date(); d.setDate(d.getDate() + intervals[p.box-1]);
  p.due = d.toISOString().slice(0,10);
  progress[w.id] = p; saveAll(); stepCard(1);
}
function attachSwipe(el){
  if(!el) return;
  let x0=null;
  el.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 60) stepCard(dx<0?1:-1);
    x0=null;
  }, {passive:true});
}
function flashSpeak(){ const w = cardState.pool[cardState.idx]; if(w) speakFr(w.french); }
function flashPronounce(){
  const w = cardState.pool[cardState.idx]; if(!w) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resultDiv = document.getElementById('pronounceResult'), btn = document.getElementById('pronounceBtn');
  if(!SR){ resultDiv.innerHTML = `<div class="feedback no">⚠️ 這個瀏覽器不支援語音辨識。建議用 iPhone Safari 或 Android Chrome 開啟。</div>`; return; }
  const rec = new SR(); rec.lang = 'fr-FR'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn.textContent = '🎙️ 聆聽中...'; btn.classList.add('listening'); resultDiv.innerHTML = '';
  rec.onresult = (e) => {
    const said = e.results[0][0].transcript;
    const score = similarity(normalizeStr(said, true), normalizeStr(w.french, true));
    let msg, cls;
    if(score >= 0.85){ msg = `✅ 很棒！辨識到「${escapeHtml(said)}」，跟「${escapeHtml(w.french)}」很接近`; cls='ok'; }
    else if(score >= 0.5){ msg = `🟡 有點接近～辨識到「${escapeHtml(said)}」，目標是「${escapeHtml(w.french)}」`; cls='no'; }
    else { msg = `❌ 辨識到「${escapeHtml(said)}」，差蠻多的，點🔊聽正確發音再試一次`; cls='no'; }
    resultDiv.innerHTML = `<div class="feedback ${cls}">${msg}</div>`;
  };
  rec.onerror = (e) => { resultDiv.innerHTML = `<div class="feedback no">⚠️ 錄音發生問題（${escapeHtml(e.error||'')}），請確認已允許麥克風權限</div>`; };
  rec.onend = () => { btn.textContent = '🎤 練習發音'; btn.classList.remove('listening'); };
  try{ rec.start(); }catch(err){ resultDiv.innerHTML = `<div class="feedback no">⚠️ 無法啟動錄音，請再試一次</div>`; }
}

function getFrenchVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
}
function pickBestFrenchVoice(voices){
  if(!voices.length) return null;
  const g = voices.find(v => /google\s*fran[cç]ais/i.test(v.name)) || voices.find(v => /google/i.test(v.name));
  if(g) return g;
  const preferred = ['thomas','audrey','amelie','amélie','aurelie','aurélie','chantal','celine','céline','virginie','marie','google français','google francais','microsoft henri','microsoft julie','ines'];
  for(const key of preferred){ const f = voices.find(v => v.name.toLowerCase().includes(key)); if(f) return f; }
  return voices.find(v => v.lang.toLowerCase()==='fr-fr') || voices[0];
}
function speakFr(text, rate){
  if(!('speechSynthesis' in window)){ alert('此瀏覽器不支援語音朗讀'); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = rate || 0.85;
  const voices = getFrenchVoices();
  const voice = pickBestFrenchVoice(voices);
  if(voice) u.voice = voice;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function populateVoiceSelect(){
  const el = document.getElementById('voiceStatus'); if(!el) return;
  const voices = getFrenchVoices(), best = pickBestFrenchVoice(voices);
  if(!best){ el.textContent = '目前這個裝置找不到法文語音。'; return; }
  const isGoogle = /google/i.test(best.name);
  el.innerHTML = isGoogle ? `✅ 目前使用：<b>${escapeHtml(best.name)}</b>`
    : `目前使用：<b>${escapeHtml(best.name)}</b><br><span style="font-size:11.5px;">這個裝置沒有 Google français，已自動改用系統內建的法文語音。</span>`;
}

    </div>`;

function startQuiz(){
  const source = document.getElementById('qSource').value, cat = document.getElementById('qCat').value,
        dir = document.getElementById('qDir').value, count = parseInt(document.getElementById('qCount').value);
  let pool = allPoolForPractice(source).filter(x=>x.french && (x.chinese||x.english));
  if(cat!=='ALL') pool = pool.filter(x=>x.cat===cat);
  if(pool.length < 4){ alert('這個範圍的題目太少了（至少需要4個），換個範圍試試'); return; }
  pool = shuffle(pool).slice(0, Math.min(count, pool.length));
  quizState = { questions: pool.map(w=>({item:w, dir})), idx:0, score:0, wrong:[], answered:false };
  renderQuiz();
}
function meaningOf(w){ return [w.chinese, w.english].filter(Boolean).join(' / '); }
function renderQuiz(){
  const q = quizState.questions[quizState.idx];
  if(!q){ renderQuizResult(); return; }
  const w = q.item;
  const distractors = shuffle(allPoolForPractice('all').filter(x=>x.french!==w.french && (x.chinese||x.english))).slice(0,3);
  const options = shuffle([w, ...distractors]), letters = ['A','B','C','D'];
  quizState.answered = false;
  document.getElementById('view-quiz').innerHTML = `
    <div class="quiz-meta"><span>第 ${quizState.idx+1} / ${quizState.questions.length} 題</span><span>得分 ${quizState.score}</span></div>
    <div class="card">
      <div class="quiz-q">${escapeHtml(q.dir==='fr2cn' ? w.french : meaningOf(w))}</div>
      ${options.map((o,i)=>`<button class="quiz-opt" id="opt${i}" onclick="answerQuiz(${i})"><span class="letter">${letters[i]}</span>${escapeHtml(q.dir==='fr2cn'? meaningOf(o) : o.french)}</button>`).join('')}
      <div id="quizFeedback"></div>
    </div>`;
  quizState._correctIdx = options.findIndex(o=>o.french===w.french);
}
function answerQuiz(i){
  if(quizState.answered) return; quizState.answered = true;
  const correct = i === quizState._correctIdx, w = quizState.questions[quizState.idx].item;
  document.getElementById('opt'+quizState._correctIdx).classList.add('correct');
  if(!correct) document.getElementById('opt'+i).classList.add('wrong');
  if(correct) quizState.score++; else quizState.wrong.push(w);
  quizHistory.played++; quizHistory.total++; if(correct) quizHistory.correct++;
  saveAll();
  const ex = w.example || w.present || '';
  document.getElementById('quizFeedback').innerHTML = `
    <div class="quiz-explain">${correct?'✅ 答對了！':'❌ 答錯了，正確答案已標綠。'}　<b>${escapeHtml(w.french)}</b> — ${escapeHtml(meaningOf(w))}${ex?'<br>例句：'+escapeHtml(ex):''}</div>
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="quizState.idx++; renderQuiz();">${quizState.idx+1<quizState.questions.length?'下一題':'看結果'}</button>`;
}
function renderQuizResult(){
  const total = quizState.questions.length;
  document.getElementById('view-quiz').innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:15px; color:var(--muted);">測驗結果</div>
      <div style="font-size:36px; font-weight:800; color:var(--primary-light); margin:8px 0;">${quizState.score} / ${total}</div>
      <div style="color:var(--muted); font-size:13px;">正確率 ${Math.round(quizState.score/total*100)}%</div>
    </div>
    ${quizState.wrong.length? `<h2 class="section-title">答錯的題目</h2><div class="card">${quizState.wrong.map(w=>`<div class="result-row"><span>${escapeHtml(w.french)}</span><span style="color:var(--muted);">${escapeHtml(meaningOf(w))}</span></div>`).join('')}</div>` : ''}

}

function tagMsg(t){ const e=document.getElementById('tagMsg'); if(e) e.textContent=t; else showToast(t); }
function addTag(){
  const name = document.getElementById('newTagInput').value.trim();
  if(!name){ tagMsg('請輸入標籤名稱'); return; }
  if(allCategories().includes(name)){ tagMsg('這個標籤已經存在了'); return; }
  pinnedCategories.push(name); saveAll(); cardState.pool = []; openTagManager();
}
function openRenameTag(i){
  tagEditing = tagList[i];
  openModal(`
    <button class="modal-close" onclick="openTagManager()">✕</button>
    <h3>✏️ 改名／合併標籤</h3>
    <label class="field-label">「${escapeHtml(tagEditing)}」改成：</label>

    <div id="tagMsg" style="color:var(--bad); font-size:12.5px; margin-top:6px;"></div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="openTagManager()">取消</button>
      <button class="btn btn-primary" onclick="confirmRenameTag()">確認</button>
    </div>`);
}
function confirmRenameTag(){
  const old = tagEditing, nn = document.getElementById('renameTagInput').value.trim();
  if(!nn){ tagMsg('請輸入標籤名稱'); return; }
  if(nn===old){ openTagManager(); return; }
  allVocab().filter(w=>w.cat===old).forEach(w=>{ wordCategoryOverrides[w.id] = nn; });
  const wasPinned = pinnedCategories.includes(old);
  pinnedCategories = pinnedCategories.filter(c=>c!==old);
  if(wasPinned && !pinnedCategories.includes(nn)) pinnedCategories.push(nn);
  deletedCategories = deletedCategories.filter(c=>c!==nn);
  if(cardState.filterCat===old) cardState.filterCat = nn;
  saveAll(); cardState.pool = []; openTagManager();
}
function deleteTag(i){
  tagEditing = tagList[i];
  const c = tagEditing, n = allVocab().filter(w=>w.cat===c).length;
  const others = allCategories().filter(x=>x!==c);
  let body;
  if(n===0){
    body = `<div style="font-size:13.5px; margin-bottom:14px;">這個標籤是空的，可以直接刪除。</div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="openTagManager()">取消</button><button class="btn btn-bad" onclick="confirmDeleteTag('none')">確認刪除</button></div>`;
  } else {
    body = `<div style="font-size:13.5px; margin-bottom:10px;">這個標籤裡有 <b>${n}</b> 個單字，要怎麼處理？</div>
      ${others.length ? `<label class="field-label">方案一：單字搬到其他標籤</label>
      <select id="delMoveTarget">${others.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('')}</select>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="confirmDeleteTag('move')">搬移單字並刪除標籤</button>` : ''}
      <label class="field-label" style="margin-top:16px;">${others.length?'方案二：':''}連單字一起刪除（無法復原）</label>

}

function copyReminderText(){
  const ta = document.getElementById('rmText'), msg = document.getElementById('rmMsg');
  if(!ta.value) makeReminderText();
  const text = ta.value; if(!text) return;
  const fallback = () => { ta.focus(); ta.select(); ta.setSelectionRange(0,99999); let ok=false; try{ ok = document.execCommand('copy'); }catch(e){} msg.textContent = ok ? '✅ 已複製，去提醒事項貼上吧' : '請長按上方文字框 →「全選」→「拷貝」'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{ msg.textContent = '✅ 已複製，去提醒事項貼上吧'; }).catch(fallback);
  } else fallback();
}

let ocrLoaded = false;
function loadTesseract(cb){
  if(window.Tesseract){ ocrLoaded = true; cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js';
  s.onload = () => { ocrLoaded = true; cb(); };
  s.onerror = () => {
    const status = document.getElementById('ocrStatus');
    if(status) status.textContent = '⚠️ 無法載入辨識功能，請確認網路連線後再試一次';
  };
  document.head.appendChild(s);
}
function runOcr(){
  const fileInput = document.getElementById('ocrFile');
  const file = fileInput && fileInput.files[0];
  if(!file){ alert('請先拍照或選一張圖片'); return; }
  const status = document.getElementById('ocrStatus');
  status.textContent = ocrLoaded ? '辨識中...' : '載入辨識引擎中...（需要網路，第一次會比較久）';
  loadTesseract(() => {
    status.textContent = '辨識中... 0%';
    window.Tesseract.recognize(file, 'fra+eng', {
      logger: m => { if(m.status==='recognizing text' && status) status.textContent = '辨識中... ' + Math.round((m.progress||0)*100) + '%'; }
    }).then(({data:{text}}) => {
      document.getElementById('ocrResult').value = (text||'').trim();
      status.textContent = text && text.trim() ? '✅ 辨識完成！請檢查文字，再填入下方欄位' : '沒有辨識到文字，換一張清楚一點的照片試試';
    }).catch(() => {
      status.textContent = '⚠️ 辨識失敗，請確認網路連線或換一張照片';
    });
  });
}

/* ---- 備份匯入 ---- */
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      const vocabKeySet = new Set(allVocab().map(v => (v.french+'|'+v.chinese).toLowerCase().trim()));
      let addedVocab = 0, skippedVocab = 0;
      (data.customVocab||[]).forEach(w=>{
        const key = (w.french+'|'+w.chinese).toLowerCase().trim();
        if(vocabKeySet.has(key)){ skippedVocab++; return; }
        vocabKeySet.add(key);
        if(customVocab.some(x=>x.id===w.id)) w.id = 'bk'+Date.now()+Math.random().toString(36).slice(2,7);
        customVocab.push(w);
        addedVocab++;
      });
      const artKeySet = new Set(allArticles().map(a => (a.title+'|'+(a.text||a.url||'')).toLowerCase().trim()));
      let addedArt = 0, skippedArt = 0;
      (data.customArticles||[]).forEach(a=>{
        const key = (a.title+'|'+(a.text||a.url||'')).toLowerCase().trim();
        if(artKeySet.has(key)){ skippedArt++; return; }
        artKeySet.add(key);
        if(customArticles.some(x=>x.id===a.id)) a.id = 'bk'+Date.now()+Math.random().toString(36).slice(2,7);
        customArticles.push(a);
        addedArt++;
      });
      Object.keys(data.notesStore||{}).forEach(articleId=>{
        if(!notesStore[articleId]) notesStore[articleId] = [];
        const noteKeySet = new Set(notesStore[articleId].map(n => (n.quote||'')+'|'+n.note));
        (data.notesStore[articleId]||[]).forEach(n=>{
          const key = (n.quote||'')+'|'+n.note;
          if(!noteKeySet.has(key)){ notesStore[articleId].push(n); noteKeySet.add(key); }
        });
      });
      Object.keys(data.progress||{}).forEach(id=>{ if(!progress[id]) progress[id] = data.progress[id]; });
      if(data.quizHistory){
        quizHistory.played = (quizHistory.played||0) + (data.quizHistory.played||0);
        quizHistory.correct = (quizHistory.correct||0) + (data.quizHistory.correct||0);
        quizHistory.total = (quizHistory.total||0) + (data.quizHistory.total||0);
      }
      (data.pinnedCategories||[]).forEach(c=>{ if(!pinnedCategories.includes(c)) pinnedCategories.push(c); });
      (data.deletedCategories||[]).forEach(c=>{ if(!deletedCategories.includes(c)) deletedCategories.push(c); });
      wordCategoryOverrides = {...(data.wordCategoryOverrides||{}), ...wordCategoryOverrides};
      (data.articleFolders||[]).forEach(f=>{ if(!articleFolders.includes(f)) articleFolders.push(f); });
      articleFolderOverrides = {...(data.articleFolderOverrides||{}), ...articleFolderOverrides};
      (data.deletedFolders||[]).forEach(f=>{ if(!deletedFolders.includes(f)) deletedFolders.push(f); });
      if(data.prefs && data.prefs.delIds){ prefs.delIds = {...data.prefs.delIds, ...(prefs.delIds||{})}; }
      saveAll();
      cardState.pool = [];
      alert(`匯入完成！\n單字：新增 ${addedVocab} 筆，略過 ${skippedVocab} 筆重複\n文章：新增 ${addedArt} 筆，略過 ${skippedArt} 筆重複`);
      renderMe();
    }catch(err){ alert('檔案格式錯誤，匯入失敗'); }
  };
  reader.readAsText(file);
}

function detectCols(headerRow){
  const map = {fr:-1,pos:-1,cn:-1,en:-1,ex:-1,cat:-1};
  (headerRow||[]).forEach((h,i)=>{
    const s = (h||'').toString().toLowerCase();
    if(map.fr<0 && (s.includes('法文')||s.includes('french')||s.includes('français'))) map.fr=i;
    else if(map.pos<0 && (s.includes('詞性')||s.includes('pos')||s.includes('詞類'))) map.pos=i;
    else if(map.cn<0 && (s.includes('中文')||s.includes('chinese'))) map.cn=i;
    else if(map.en<0 && (s.includes('英文')||s.includes('english'))) map.en=i;
    else if(map.ex<0 && (s.includes('例句')||s.includes('example')||s.includes('sentence')||s.includes('句子'))) map.ex=i;
    else if(map.cat<0 && (s.includes('分類')||s.includes('category')||s.includes('主題'))) map.cat=i;
  });
  return map;
}
function parseXlsxFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = window.XLSX.read(e.target.result, {type:'array'});
      let rawRows = [];
      let headerRow = [];
      let gotHeader = false;
      wb.SheetNames.forEach(sheetName => {
        if(sheetName === '說明') return;
        const ws = wb.Sheets[sheetName];
        const data = window.XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        if(data.length < 1) return;
        if(!gotHeader){ headerRow = data[0]; gotHeader = true; }
        data.forEach((row,ri)=>{
          if(!row || row.every(c=>c===''||c===null||c===undefined)) return;
          rawRows.push({cells: row, sheet: sheetName, isFirstRow: ri===0});
        });
      });
      if(rawRows.length===0){
        document.getElementById('importStatus').textContent = '⚠️ 讀不到任何資料列，請確認檔案內容';
        return;
      }
      importRaw = { rows: rawRows, headerRow };
      document.getElementById('importStatus').textContent = `✅ 讀到 ${rawRows.length} 列資料，請確認下面的欄位對應（例句抓不到的話可以在這裡手動調整）`;
      renderColumnMapping('Excel');
    }catch(err){
      document.getElementById('importStatus').textContent = '⚠️ 解析失敗，請確認檔案格式是否為正常的 Excel 檔';
    }
  };
  reader.readAsArrayBuffer(file);
}
function renderColumnMapping(sourceType){
  const rows = importRaw.rows;
  const header = importRaw.headerRow || [];
  const maxCols = Math.max(...rows.map(r=>r.cells.length), header.length, 1);
  const guess = detectCols(header);
  const looksLikeHeader = header.some(h=>{
    const s = (h||'').toString().toLowerCase();
    return s.includes('法文')||s.includes('中文')||s.includes('english')||s.includes('french')||s.includes('例句');
  });
  if(!looksLikeHeader && guess.fr<0 && guess.cn<0 && guess.en<0){
    guess.fr=0; guess.cn=1; guess.en=2; guess.ex=3;
  }
  const colOpt = (sel) => {
    let o = '<option value="-1">（不使用）</option>';
    for(let i=0;i<maxCols;i++){
      const raw = header[i];
      const label = (raw!==undefined && raw!=='') ? String(raw).slice(0,14) : `第 ${i+1} 欄`;
      o += `<option value="${i}" ${sel===i?'selected':''}>第${i+1}欄：${escapeHtml(label)}</option>`;
    }
    return o;
  };
  const area = document.getElementById('importMappingArea');
  area.innerHTML = `
    <div class="card" style="margin-top:10px;">
      <div style="font-size:13px; font-weight:700; color:var(--primary); margin-bottom:8px;">🔧 欄位對應（自動偵測不準時可以自己改，改完按下面套用）</div>
      <div style="font-size:11.5px; color:var(--muted); margin-bottom:2px;">法文（必填）</div>
      <select id="mapFr">${colOpt(guess.fr)}</select>
      <div style="font-size:11.5px; color:var(--muted); margin:6px 0 2px;">中文</div>
      <select id="mapCn">${colOpt(guess.cn)}</select>
      <div style="font-size:11.5px; color:var(--muted); margin:6px 0 2px;">英文</div>
      <select id="mapEn">${colOpt(guess.en)}</select>
      <div style="font-size:11.5px; color:var(--muted); margin:6px 0 2px;">例句</div>
      <select id="mapEx">${colOpt(guess.ex)}</select>
      <div style="font-size:11.5px; color:var(--muted); margin:6px 0 2px;">詞性</div>
      <select id="mapPos">${colOpt(guess.pos)}</select>
      <div style="font-size:11.5px; color:var(--muted); margin:6px 0 2px;">分類（不選就用工作表名稱）</div>
      <select id="mapCat">${colOpt(guess.cat)}</select>
      <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-top:10px;">
        <input type="checkbox" id="skipHeaderChk" ${looksLikeHeader?'checked':''} style="width:auto;"> 第一列是標題列，跳過不匯入
      </label>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="applyColumnMapping('${sourceType}')">套用欄位設定，產生預覽 →</button>
    </div>
  `;
  applyColumnMapping(sourceType);
}
function looksLikeDefaultSheetName(name){
  return /^(sheet\s*\d*|工作表\s*\d*)$/i.test((name||'').trim());
}
function applyColumnMapping(sourceType){
  const m = {
    fr: parseInt(document.getElementById('mapFr').value),
    cn: parseInt(document.getElementById('mapCn').value),
    en: parseInt(document.getElementById('mapEn').value),
    ex: parseInt(document.getElementById('mapEx').value),
    pos: parseInt(document.getElementById('mapPos').value),
    cat: parseInt(document.getElementById('mapCat').value),
    skipHeader: document.getElementById('skipHeaderChk').checked,
  };
  const rows = [];
  importRaw.rows.forEach(r=>{
    if(m.skipHeader && r.isFirstRow) return;
    const cells = r.cells;
    const fr = m.fr>=0 ? String(cells[m.fr]||'').trim() : '';
    if(!fr) return;
    let cat = '';
    if(m.cat>=0 && cells[m.cat]) cat = String(cells[m.cat]).trim();
    else if(!looksLikeDefaultSheetName(r.sheet)) cat = r.sheet;
    rows.push({
      select:true,
      french: fr,
      pos: m.pos>=0 ? String(cells[m.pos]||'').trim() : '',
      chinese: m.cn>=0 ? String(cells[m.cn]||'').trim() : '',
      english: m.en>=0 ? String(cells[m.en]||'').trim() : '',
      example: m.ex>=0 ? String(cells[m.ex]||'').trim() : '',
      cat: cat,
    });
  });
  finishParse(rows, sourceType);
}
async function parsePdfFile(file){
  const status = document.getElementById('importStatus');
  try{
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    let allLines = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let lineMap = {};
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        if(!lineMap[y]) lineMap[y]=[];
        lineMap[y].push(it.str);
      });
      Object.keys(lineMap).sort((a,b)=>b-a).forEach(y=>{
        const line = lineMap[y].join(' ').trim();
        if(line) allLines.push(line);
      });
      if(status) status.textContent = `解析中... 第 ${p}/${pdf.numPages} 頁`;
    }
    if(allLines.length===0){
      status.textContent = '這份 PDF 抓不到文字（可能是掃描圖片檔），沒辦法自動匯入。建議改用「新增單字」裡的拍照辨識，一筆一筆處理並自行核對。';
      return;
    }
    const rows = [];
    const seps = [' - ', '：', ' : ', '\t', ' — ', ' – ', ' = '];
    allLines.forEach(line=>{
      let parts = null;
      for(const sep of seps){ if(line.includes(sep)){ parts = line.split(sep); break; } }
      if(!parts || parts.length<2) return;
      const fr = parts[0].trim();
      const rest = parts.slice(1).join(' ').trim();
      if(!fr || !rest || fr.length>50) return;
      rows.push({select:true, french:fr, pos:'', chinese:rest, english:'', example:'', cat:'PDF 匯入'});
    });
    finishParse(rows, 'PDF');
  }catch(err){
    if(status) status.textContent = '⚠️ PDF 解析失敗：' + (err.message||'請換一個檔案再試');
  }
}
function finishParse(rows, sourceType){
  importedRows = rows;
  const status = document.getElementById('importStatus');
  if(rows.length===0){
    status.textContent = `沒有解析到任何單字。${sourceType==='PDF'?'PDF 裡的文字排列格式可能不是「法文－意思」這種形式，建議改用 Excel 檔匯入，或用拍照單筆新增。':'請確認欄位內容，或檢查表頭有沒有包含「法文／中文／英文」等字樣。'}`;
    document.getElementById('importPreviewWrap').innerHTML = '';
    return;
  }
  const capped = rows.length > 200;
  status.textContent = `✅ 解析到 ${rows.length} 筆！請檢查內容（可直接編輯、取消勾選不要的項目）再確認匯入。${capped?'為了手機順暢，下面僅預覽前 200 筆，其餘會照樣一起匯入。':''}`;
  renderImportPreview();
}
function renderImportPreview(){
  const wrap = document.getElementById('importPreviewWrap');
  const checkedCount = importedRows.filter(r=>r.select).length;
  const showRows = importedRows.slice(0, 200);
  wrap.innerHTML = `
    <div class="btn-row" style="margin:10px 0;">
      <button class="btn btn-ghost" onclick="toggleAllImport(true)">全選</button>
      <button class="btn btn-ghost" onclick="toggleAllImport(false)">取消全選</button>
    </div>
    <div style="max-height:340px; overflow-y:auto; border:1px solid var(--border); border-radius:10px;">
      ${showRows.map((r,i)=>`
        <div style="padding:7px 8px; border-bottom:1px solid var(--border);">
          <div style="display:flex; gap:5px; align-items:center; margin-bottom:4px;">
            <input type="checkbox" ${r.select?'checked':''} onchange="importedRows[${i}].select=this.checked" style="width:auto; flex:0 0 auto;">
            <input type="text" value="${escapeHtml(r.french)}" oninput="importedRows[${i}].french=this.value" placeholder="法文" style="width:33%; padding:5px; font-size:11.5px;">
            <input type="text" value="${escapeHtml(r.chinese)}" oninput="importedRows[${i}].chinese=this.value" placeholder="中文" style="width:33%; padding:5px; font-size:11.5px;">
            <input type="text" value="${escapeHtml(r.english)}" oninput="importedRows[${i}].english=this.value" placeholder="英文" style="width:33%; padding:5px; font-size:11.5px;">
          </div>
          <input type="text" value="${escapeHtml(r.example)}" oninput="importedRows[${i}].example=this.value" placeholder="例句" style="width:100%; padding:5px; font-size:11.5px; color:var(--muted); margin-bottom:4px;">
          <div style="display:flex; gap:5px;">
            <input type="text" value="${escapeHtml(r.pos)}" oninput="importedRows[${i}].pos=this.value" placeholder="詞性（選填）" style="width:50%; padding:5px; font-size:11px; color:var(--muted);">
            <input type="text" value="${escapeHtml(r.cat)}" oninput="importedRows[${i}].cat=this.value" placeholder="分類（選填）" style="width:50%; padding:5px; font-size:11px; color:var(--muted);">
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="confirmImport()">✅ 確認匯入（目前勾選 ${checkedCount} 筆）</button>
  `;
}
function toggleAllImport(v){
  importedRows.forEach(r=>r.select=v);
  renderImportPreview();
}
function confirmImport(){
  const existingKeys = new Set(allVocab().map(v=>(v.french+'|'+v.chinese).toLowerCase().trim()));
  let added=0, skippedDup=0;
  importedRows.filter(r=>r.select && r.french.trim()).forEach(r=>{
    const key = (r.french+'|'+r.chinese).toLowerCase().trim();
    if(existingKeys.has(key)){ skippedDup++; return; }
    existingKeys.add(key);
    customVocab.push({
      id: 'imp'+Date.now()+Math.random().toString(36).slice(2,7),
      cat: (r.cat && r.cat.trim()) || '片語',
      french: r.french.trim(), pos: r.pos||'', chinese: r.chinese||'', english: r.english||'', example: r.example||'',
    });
    added++;
  });
  saveAll();
  closeModal();
  cardState.pool = [];
  alert(`匯入完成！新增 ${added} 筆${skippedDup?`，略過 ${skippedDup} 筆重複`:''}`);
  renderMe();
}

      ${moveModalWords.length ? moveModalWords.map((w,i)=>`
        <label style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px;">
          <input type="checkbox" ${w.checked?'checked':''} onchange="moveModalWords[${i}].checked=this.checked" style="width:auto;">

        </label>
      `).join('') : '<div class="empty-hint">這個分類目前沒有單字</div>'}
    </div>
    <label class="field-label">搬移到哪個分類？</label>
    <select id="moveTargetCat" onchange="document.getElementById('moveNewCatName').style.display = this.value==='__NEW__' ? 'block' : 'none';">

  `);
}
function toggleAllMoveWords(v){
  moveModalWords.forEach(w=>w.checked=v);
  renderMoveWordsModal();
}
function confirmMoveWords(){
  const sel = document.getElementById('moveTargetCat').value;
  let target = sel;
  if(sel === '__NEW__'){
    target = document.getElementById('moveNewCatName').value.trim();
    if(!target){ alert('請輸入新分類名稱'); return; }
  }
  const idsToMove = moveModalWords.filter(w=>w.checked).map(w=>w.id);
  if(idsToMove.length===0){ alert('請至少勾選一個單字'); return; }
  idsToMove.forEach(id => { wordCategoryOverrides[id] = target; });
  saveAll();
  cardState.pool = [];
  alert(`已搬移 ${idsToMove.length} 個單字到「${target}」`);
  openManageCategoriesModal();
}
function openDeleteCategoryModal(i){
  const cat = manageCatList[i];
  const count = allVocab().filter(w=>w.cat===cat).length;
  openModal(`
    <button class="modal-close" onclick="openManageCategoriesModal()">✕</button>
    <h3>🗑️ 刪除分類「${escapeHtml(cat)}」</h3>
    <div style="font-size:13px; color:var(--bad); margin-bottom:12px; line-height:1.6;">
      ⚠️ 這會把「${escapeHtml(cat)}」分類與底下所有 ${count} 個單字一併移除，此操作無法復原。
    </div>
    <label class="field-label">請輸入 delete 以確認：</label>
    <input type="text" id="deleteConfirmInput" placeholder="delete" autocapitalize="off" autocomplete="off">
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="openManageCategoriesModal()">取消</button>
      <button class="btn btn-bad" onclick="confirmDeleteCategory()">確認刪除</button>
    </div>
  `);
  moveModalCat = cat;
}
function confirmDeleteCategory(){
  const cat = moveModalCat;
  const typed = (document.getElementById('deleteConfirmInput').value || '').trim().toLowerCase();
  if(typed !== 'delete'){ alert('請輸入 delete 才能刪除'); return; }
  customVocab = customVocab.filter(w => (wordCategoryOverrides[w.id]||w.cat) !== cat);
  if(!deletedCategories.includes(cat)) deletedCategories.push(cat);
  pinnedCategories = pinnedCategories.filter(x=>x!==cat);
  saveAll();
  cardState.pool = [];
  alert(`已刪除「${cat}」分類`);
  openManageCategoriesModal();
}
