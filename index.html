<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法文學習">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E4A7D">
<title>法文學習 App</title>
<style>
:root{
  --primary:#2E4A7D; --primary-light:#4472C4; --accent:#C00000;
  --bg:#F5F6FA; --card:#FFFFFF; --text:#1B1F27; --muted:#6B7280;
  --good:#1E8E5A; --bad:#D33; --border:#E4E7EC;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y: contain;}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

/* ---------- top bar ---------- */
.topbar{background:var(--primary); color:#fff; padding:calc(10px + var(--safe-top)) 16px 12px;
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
.topbar h1{font-size:17px; margin:0; font-weight:700;}
.topbar .sub{font-size:11px; opacity:.75; margin-top:2px;}
.icon-btn{background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px; border-radius:10px;
  font-size:18px; display:flex; align-items:center; justify-content:center;}

/* ---------- main content ---------- */
.view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 20px;}
.view.hidden{display:none;}

/* ---------- bottom nav ---------- */
nav.tabbar{display:flex; background:#fff; border-top:1px solid var(--border);
  padding-bottom: var(--safe-bottom); flex-shrink:0;}
nav.tabbar button{flex:1; background:none; border:none; padding:8px 2px 6px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--muted); font-size:10.5px; font-family:inherit;}
nav.tabbar button .ic{font-size:20px;}
nav.tabbar button.active{color:var(--primary-light); font-weight:700;}

/* ---------- generic components ---------- */
.card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
h2.section-title{font-size:15px; margin:4px 0 10px; color:var(--primary); font-weight:800;}
.btn{border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; font-family:inherit;}
.btn-primary{background:var(--primary-light); color:#fff;}
.btn-outline{background:#fff; border:1.5px solid var(--primary-light); color:var(--primary-light);}
.btn-ghost{background:var(--bg); color:var(--text);}
.btn-good{background:var(--good); color:#fff;}
.btn-bad{background:var(--bad); color:#fff;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.btn:disabled{opacity:.4;}
select, input[type=text], textarea{width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px;
  font-size:14px; font-family:inherit; background:#fff; color:var(--text);}
textarea{resize:vertical;}
label.field-label{font-size:12px; color:var(--muted); font-weight:700; margin:10px 0 4px; display:block;}
.chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.chip{background:#fff; border:1.5px solid var(--border); border-radius:20px; padding:6px 12px; font-size:12.5px; color:var(--muted);}
.chip.active{background:var(--primary-light); border-color:var(--primary-light); color:#fff; font-weight:700;}
.empty-hint{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}
.fab{position:fixed; right:16px; bottom:calc(78px + var(--safe-bottom)); width:52px; height:52px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:0 4px 10px rgba(0,0,0,.25); z-index:20;}

/* ---------- modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50;}
.modal-bg.hidden{display:none;}
.modal{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + var(--safe-bottom));}
.modal h3{margin:0 0 10px; font-size:16px; color:var(--primary);}
.modal-close{float:right; background:none; border:none; font-size:20px; color:var(--muted);}

/* ---------- flashcards ---------- */
.flash-wrap{display:flex; flex-direction:column; align-items:center;}
.flash-progress{font-size:12px; color:var(--muted); margin-bottom:8px;}
.flashcard{width:100%; max-width:420px; min-height:230px; border-radius:18px; background:linear-gradient(160deg,#4472C4,#2E4A7D);
  color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 18px;
  text-align:center; box-shadow:0 6px 18px rgba(46,74,125,.35); position:relative;}
.flashcard .pos-tag{position:absolute; top:12px; left:14px; font-size:11px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:20px;}
.flashcard .fr-word{font-size:27px; font-weight:800; line-height:1.3;}
.flashcard .back{margin-top:14px; font-size:15px; line-height:1.6; opacity:.97;}
.flashcard .example{margin-top:12px; font-size:12.5px; font-style:italic; opacity:.85; border-top:1px solid rgba(255,255,255,.3); padding-top:10px;}
.flashcard .flip-hint{position:absolute; bottom:10px; font-size:10.5px; opacity:.65;}
.flash-actions{display:flex; gap:10px; width:100%; max-width:420px; margin-top:16px;}
.flash-actions .btn{flex:1; padding:13px;}
.flash-audio-row{display:flex; gap:10px; width:100%; max-width:420px; margin-top:14px;}
.flash-audio-row .btn{flex:1; padding:11px; font-size:13px;}
.flash-audio-row .btn.listening{background:var(--accent); color:#fff; border-color:var(--accent);}
.flash-nav{display:flex; gap:14px; margin-top:14px; align-items:center;}
.flash-nav button{background:none; border:none; font-size:22px; color:var(--primary-light);}

/* ---------- practice ---------- */
.practice-word{font-size:24px; font-weight:800; color:var(--primary); text-align:center; margin:6px 0 4px;}
.practice-meaning{text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px;}
.blank-display{text-align:center; font-size:22px; letter-spacing:3px; font-weight:700; color:var(--primary); margin:12px 0;}
.feedback{border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:10px;}
.feedback.ok{background:#E3F5EC; color:var(--good);}
.feedback.no{background:#FCE8E8; color:var(--bad);}
.speaker-btn{display:block; margin:0 auto 14px; background:var(--primary-light); color:#fff; border:none; width:64px; height:64px;
  border-radius:50%; font-size:26px;}

/* ---------- reading ---------- */
.article-item{background:#fff; border-radius:12px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.article-item .t{font-weight:700; font-size:14.5px; color:var(--text);}
.article-item .meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.article-body{background:#fff; border-radius:14px; padding:16px; font-size:15.5px; line-height:1.9; margin-bottom:14px;}
.sel-panel{background:#FFF8E6; border:1.5px dashed #E0B84A; border-radius:12px; padding:10px 12px; margin-bottom:14px; font-size:13px;}
.sel-panel .quote{font-style:italic; color:#7A5A00; margin-bottom:6px;}
.note-item{background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.note-item .quote{font-size:12.5px; color:var(--primary-light); font-style:italic; border-left:3px solid var(--primary-light); padding-left:8px; margin-bottom:5px;}
.note-item .txt{font-size:13.5px;}
.note-item .del{float:right; color:var(--bad); font-size:12px; background:none; border:none;}

/* ---------- quiz ---------- */
.quiz-q{font-size:20px; font-weight:800; text-align:center; margin:10px 0 20px; color:var(--primary); line-height:1.5;}
.quiz-opt{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--border); border-radius:12px;
  padding:13px 14px; margin-bottom:10px; font-size:14.5px;}
.quiz-opt .letter{display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--bg); text-align:center;
  line-height:22px; font-size:12px; font-weight:700; margin-right:8px; color:var(--muted);}
.quiz-opt.correct{background:#E3F5EC; border-color:var(--good);}
.quiz-opt.wrong{background:#FCE8E8; border-color:var(--bad);}
.quiz-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;}
.quiz-explain{background:var(--bg); border-radius:10px; padding:10px 12px; font-size:13px; margin-top:8px; color:var(--muted);}
.result-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}

/* ---------- stats ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat-box{background:#fff; border-radius:12px; padding:14px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat-box .num{font-size:24px; font-weight:800; color:var(--primary-light);}
.stat-box .lbl{font-size:11.5px; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1 id="topTitle">法文學習</h1>
      <div class="sub" id="topSub">217 個單字・95 個動詞句型</div>
    </div>
    <button class="icon-btn" onclick="switchTab('me')">⚙️</button>
  </div>

  <div class="view" id="view-cards"></div>
  <div class="view hidden" id="view-practice"></div>
  <div class="view hidden" id="view-reading"></div>
  <div class="view hidden" id="view-quiz"></div>
  <div class="view hidden" id="view-me"></div>

  <nav class="tabbar">
    <button data-tab="cards" class="active"><span class="ic">🗂️</span>字卡</button>
    <button data-tab="practice"><span class="ic">✍️</span>練習</button>
    <button data-tab="reading"><span class="ic">📖</span>閱讀</button>
    <button data-tab="quiz"><span class="ic">📝</span>測驗</button>
    <button data-tab="me"><span class="ic">👤</span>我的</button>
  </nav>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

const ARTICLES_DEFAULT = [{"id": "a1", "title": "Une journée typique（日常作息）", "text": "Je m'appelle Maggie. Voici ma journée typique. Le matin, je me réveille à sept heures et je me lève tout de suite. Je me douche, puis je m'habille. Ensuite, je prends mon petit-déjeuner et je pars pour l'université. À midi, je déjeune avec mes amis à la fac. L'après-midi, j'ai des cours et je travaille sur mes projets. Le soir, je rentre chez moi vers dix-neuf heures. Je fais la cuisine, je dîne et je regarde un peu la télévision. Avant de me coucher, je révise mon vocabulaire de français. Je me couche vers minuit parce que j'ai beaucoup de travail. Demain, je vais me lever encore plus tôt !"}, {"id": "a2", "title": "Je suis malade（生病）", "text": "Depuis deux jours, je ne suis pas en forme. J'ai mal à la gorge et j'ai un peu de fièvre. Hier soir, j'ai commencé à tousser et j'avais le nez qui coule. Ce matin, je me sens très fatiguée, alors je décide de rester à la maison. Je prends des médicaments et je bois beaucoup d'eau chaude. Mon amie me dit : « Il faut aller chez le médecin si tu ne vas pas mieux demain. » Je pense qu'elle a raison. Je vais aussi dormir tôt ce soir pour bien me reposer. J'espère que je n'aurai plus de fièvre demain matin, parce que j'ai un entretien important après-demain !"}, {"id": "a3", "title": "Chercher un stage en France（找實習）", "text": "Je cherche un stage de six mois en France. C'est un peu stressant, mais je suis motivée ! Chaque jour, je regarde des offres sur Internet et j'envoie mon CV et ma lettre de motivation. La semaine dernière, une entreprise à Paris m'a contactée pour un entretien. J'étais très contente, mais aussi un peu angoissée parce que mon français n'est pas encore parfait. Avant l'entretien, j'ai révisé mes réponses et j'ai demandé des conseils à mon professeur. Pendant l'entretien, j'ai parlé de mon expérience professionnelle à Taïwan et de mon mandarin natif. À la fin, la responsable m'a dit qu'elle allait me recontacter dans une semaine. Maintenant, j'attends la réponse avec impatience !"}, {"id": "a4", "title": "Le temps qu'il fait（天氣與旅行）", "text": "Ce week-end, je vais voyager à Nice avec deux amies. Avant de partir, je regarde la météo. Vendredi, il va faire beau et il va y avoir du soleil : parfait pour la plage ! Mais samedi, il va pleuvoir un peu et il va faire plus frais. Nous devons donc prendre un parapluie et une veste. Dimanche, le temps va être nuageux, mais il ne va pas faire froid. Je suis très contente parce que je n'ai jamais visité le sud de la France. J'ai envie de me promener au bord de la mer et de goûter la cuisine locale. J'espère qu'il ne va pas pleuvoir toute la journée !"}, {"id": "a5", "title": "Faire du shopping（買衣服）", "text": "Il fait de plus en plus froid, alors je décide de faire du shopping. Je vais dans un grand magasin près de chez moi. J'ai besoin d'un manteau chaud, d'une écharpe et de nouvelles chaussures. Dans le magasin, une vendeuse me demande : « Je peux vous aider ? » Je réponds que je cherche un manteau noir, pas trop cher. Elle me propose plusieurs modèles. J'essaie une veste bleue, mais elle est trop petite. Finalement, je trouve un joli manteau gris qui me va très bien. Je l'achète avec ma carte de crédit. Je suis contente de mon shopping, mais j'ai dépensé plus d'argent que prévu !"}, {"id": "a6", "title": "Un nouvel appartement（新公寓）", "text": "La semaine dernière, j'ai emménagé dans un nouvel appartement près de la fac. Il y a une chambre, une petite cuisine et une salle de bains. Il n'y a pas d'ascenseur, alors je dois prendre l'escalier tous les jours — c'est bon pour le sport ! Mon appartement est un peu petit, mais il est calme et lumineux. Le premier jour, j'ai rangé mes affaires et j'ai fait le ménage. Mes nouveaux voisins sont très gentils ; ils m'ont invitée à prendre un café. Maintenant, je me sens vraiment chez moi. J'ai hâte de recevoir mes amis dans mon nouveau logement !"}].map(a => ({...a, type:'text'}));

/* ================= STORAGE ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let customVocab = LS.get('fr_customVocab', []);
let customArticles = LS.get('fr_customArticles', []);
let notesStore = LS.get('fr_notes', {});          // {articleId: [{quote,note,ts}]}
let progress = LS.get('fr_progress', {});          // {id: {box, due, seen, correct, wrong}}
let quizHistory = LS.get('fr_quizHistory', {played:0, correct:0, total:0});
let prefs = LS.get('fr_prefs', {ignoreAccents:false});

function saveAll(){
  LS.set('fr_customVocab', customVocab);
  LS.set('fr_customArticles', customArticles);
  LS.set('fr_notes', notesStore);
  LS.set('fr_progress', progress);
  LS.set('fr_quizHistory', quizHistory);
  LS.set('fr_prefs', prefs);
}

function allVocab(){ return [...VOCAB_DEFAULT, ...customVocab]; }
function allArticles(){ return [...ARTICLES_DEFAULT, ...LINKS_DEFAULT, ...customArticles]; }
function allPoolForPractice(source){
  // source: 'vocab' | 'verb' | 'all'
  if(source==='vocab') return allVocab().map(x=>({...x, kind:'vocab'}));
  if(source==='verb') return [...VERB_DEFAULT.map(x=>({...x, kind:'verb'})), ...GRAMMAR_DEFAULT.map(x=>({...x, kind:'grammar'}))];
  return [...allVocab().map(x=>({...x, kind:'vocab'})), ...VERB_DEFAULT.map(x=>({...x, kind:'verb'})), ...GRAMMAR_DEFAULT.map(x=>({...x, kind:'grammar'}))];
}
function vocabCategories(){ return [...new Set(VOCAB_DEFAULT.map(x=>x.cat))]; }

/* ================= NAV ================= */
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+tab).classList.remove('hidden');
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const titles = {cards:['字卡學習','點卡片翻面，左右滑動切換'], practice:['拼寫練習','聽寫／填空／造句'],
    reading:['文章閱讀','選取文字即可加筆記'], quiz:['選擇題測驗','即時批改與解析'], me:['我的學習','資料管理與統計']};
  document.getElementById('topTitle').textContent = titles[tab][0];
  document.getElementById('topSub').textContent = titles[tab][1];
  if(tab==='cards') renderCards();
  if(tab==='practice') renderPractice();
  if(tab==='reading') renderReadingList();
  if(tab==='quiz') renderQuizSetup();
  if(tab==='me') renderMe();
}
document.querySelectorAll('nav.tabbar button').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalBg').classList.add('hidden'); }

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalizeStr(s, ignoreAccents){
  s = (s||'').trim().toLowerCase();
  s = s.replace(/[.。,，!！?？;；:：]+$/g, '');   // 句尾標點不計較
  s = s.replace(/[.。,，!！?？;；:：]/g, '');      // 句中標點也去掉
  s = s.replace(/\s+/g, ' ').trim();               // 多餘空白
  if(ignoreAccents) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s;
}

/* ============================================================
   1) FLASHCARDS
   ============================================================ */
let cardState = { pool: [], idx: 0, flipped: false, filterCat: 'ALL' };

function dueList(){
  const today = new Date().toISOString().slice(0,10);
  return allVocab().filter(w => {
    const p = progress[w.id];
    if(!p) return true;
    return p.due <= today;
  });
}
function buildCardPool(){
  let pool;
  if(cardState.filterCat==='ALL') pool = allVocab();
  else if(cardState.filterCat==='DUE') pool = dueList();
  else if(cardState.filterCat==='NEW') pool = customVocab;
  else pool = allVocab().filter(w=>w.cat===cardState.filterCat);
  cardState.pool = shuffle(pool);
  cardState.idx = 0; cardState.flipped = false;
}

function renderCards(){
  if(cardState.pool.length===0) buildCardPool();
  const cats = vocabCategories();
  let chips = `<div class="chip ${cardState.filterCat==='ALL'?'active':''}" onclick="setCardFilter('ALL')">全部 (${allVocab().length})</div>
    <div class="chip ${cardState.filterCat==='DUE'?'active':''}" onclick="setCardFilter('DUE')">待複習 (${dueList().length})</div>
    <div class="chip ${cardState.filterCat==='NEW'?'active':''}" onclick="setCardFilter('NEW')">我新增的 (${customVocab.length})</div>`;
  cats.forEach(c=>{ chips += `<div class="chip ${cardState.filterCat===c?'active':''}" onclick="setCardFilter('${escapeHtml(c)}')">${escapeHtml(c)}</div>`; });

  let body;
  if(cardState.pool.length===0){
    body = `<div class="empty-hint">這個分類目前沒有單字，換一個分類看看，或到「我的」新增單字。</div>`;
  } else {
    const w = cardState.pool[cardState.idx];
    body = `
    <div class="flash-wrap">
      <div class="flash-progress">${cardState.idx+1} / ${cardState.pool.length}　${escapeHtml(w.cat)}</div>
      <div class="flashcard" id="flipcard" onclick="flipCard()">
        <div class="pos-tag">${escapeHtml(w.pos||w.type||'')}</div>
        ${!cardState.flipped ? `
          <div class="fr-word">${escapeHtml(w.french)}</div>
          <div class="flip-hint">👆 點擊看意思</div>
        ` : `
          <div class="fr-word" style="font-size:20px;">${escapeHtml(w.french)}</div>
          <div class="back">${escapeHtml(w.chinese)}<br>${escapeHtml(w.english)}</div>
          ${w.example?`<div class="example">${escapeHtml(w.example)}</div>`:''}
        `}
      </div>
      <div class="flash-audio-row" id="flashAudioRow">
        <button class="btn btn-outline" onclick="flashSpeak()">🔊 播放發音</button>
        <button class="btn btn-outline" id="pronounceBtn" onclick="flashPronounce()">🎤 練習發音</button>
      </div>
      <div id="pronounceResult"></div>
      <div class="flash-actions">
        <button class="btn btn-bad" onclick="gradeCard(false)">😕 不熟</button>
        <button class="btn btn-good" onclick="gradeCard(true)">😀 記住了</button>
      </div>
      <div class="flash-nav">
        <button onclick="stepCard(-1)">‹</button>
        <button onclick="flipCard()" style="font-size:14px;">🔄 翻面</button>
        <button onclick="stepCard(1)">›</button>
      </div>
    </div>`;
  }
  document.getElementById('view-cards').innerHTML = `<div class="chip-row">${chips}</div>` + body +
    `<button class="fab" onclick="openAddWordModal()">＋</button>`;
  attachSwipe(document.getElementById('flipcard'));
}
function setCardFilter(c){ cardState.filterCat = c; buildCardPool(); renderCards(); }
function flipCard(){ cardState.flipped = !cardState.flipped; renderCards(); }
function stepCard(dir){
  if(cardState.pool.length===0) return;
  cardState.idx = (cardState.idx + dir + cardState.pool.length) % cardState.pool.length;
  cardState.flipped = false; renderCards();
}
function gradeCard(good){
  const w = cardState.pool[cardState.idx];
  if(!w) return;
  const p = progress[w.id] || {box:1, seen:0, correct:0, wrong:0};
  p.seen++;
  if(good){ p.correct++; p.box = Math.min(5, p.box+1); } else { p.wrong++; p.box = 1; }
  const intervals = [0,1,3,7,16,30];
  const d = new Date(); d.setDate(d.getDate() + intervals[p.box-1]);
  p.due = d.toISOString().slice(0,10);
  progress[w.id] = p;
  saveAll();
  stepCard(1);
}
function attachSwipe(el){
  if(!el) return;
  let x0=null;
  el.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 60){ stepCard(dx<0?1:-1); }
    x0=null;
  }, {passive:true});
}

/* ---- 發音播放 & 發音評分（字卡） ---- */
function flashSpeak(){
  const w = cardState.pool[cardState.idx];
  if(w) speakFr(w.french);
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function similarity(a,b){
  const dist = levenshtein(a,b);
  const maxLen = Math.max(a.length, b.length, 1);
  return 1 - dist/maxLen;
}
function flashPronounce(){
  const w = cardState.pool[cardState.idx];
  if(!w) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resultDiv = document.getElementById('pronounceResult');
  const btn = document.getElementById('pronounceBtn');
  if(!SR){
    if(resultDiv) resultDiv.innerHTML = `<div class="feedback no">⚠️ 這個瀏覽器不支援語音辨識。建議用 iPhone Safari 或 Android Chrome 開啟本 App 試試。</div>`;
    return;
  }
  const rec = new SR();
  rec.lang = 'fr-FR';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  if(btn){ btn.textContent = '🎙️ 聆聽中...請說出這個字'; btn.classList.add('listening'); }
  if(resultDiv) resultDiv.innerHTML = '';
  rec.onresult = (e) => {
    const said = e.results[0][0].transcript;
    const score = similarity(normalizeStr(said, true), normalizeStr(w.french, true));
    let msg, cls;
    if(score >= 0.85){ msg = `✅ 很棒！辨識到你說的是「${escapeHtml(said)}」，跟「${escapeHtml(w.french)}」很接近`; cls='ok'; }
    else if(score >= 0.5){ msg = `🟡 有點接近～辨識到「${escapeHtml(said)}」，目標是「${escapeHtml(w.french)}」，再多練習幾次`; cls='no'; }
    else { msg = `❌ 辨識到「${escapeHtml(said)}」，跟「${escapeHtml(w.french)}」差蠻多的，點🔊聽正確發音再試一次`; cls='no'; }
    if(resultDiv) resultDiv.innerHTML = `<div class="feedback ${cls}">${msg}</div>`;
  };
  rec.onerror = (e) => {
    if(resultDiv) resultDiv.innerHTML = `<div class="feedback no">⚠️ 錄音發生問題（${escapeHtml(e.error||'')}），請確認已允許麥克風權限</div>`;
  };
  rec.onend = () => { if(btn){ btn.textContent = '🎤 練習發音'; btn.classList.remove('listening'); } };
  try{ rec.start(); }catch(err){ if(resultDiv) resultDiv.innerHTML = `<div class="feedback no">⚠️ 無法啟動錄音，請再試一次</div>`; }
}

let ocrLoaded = false;
function loadTesseract(cb){
  if(window.Tesseract){ ocrLoaded = true; cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js';
  s.onload = () => { ocrLoaded = true; cb(); };
  s.onerror = () => {
    const status = document.getElementById('ocrStatus');
    if(status) status.textContent = '⚠️ 無法載入辨識功能，請確認網路連線後再試一次';
  };
  document.head.appendChild(s);
}
function runOcr(){
  const fileInput = document.getElementById('ocrFile');
  const file = fileInput && fileInput.files[0];
  if(!file){ alert('請先拍照或選一張圖片'); return; }
  const status = document.getElementById('ocrStatus');
  status.textContent = ocrLoaded ? '辨識中...' : '載入辨識引擎中...（需要網路，第一次會比較久）';
  loadTesseract(() => {
    status.textContent = '辨識中... 0%';
    window.Tesseract.recognize(file, 'fra+eng', {
      logger: m => { if(m.status==='recognizing text' && status) status.textContent = '辨識中... ' + Math.round((m.progress||0)*100) + '%'; }
    }).then(({data:{text}}) => {
      document.getElementById('ocrResult').value = (text||'').trim();
      status.textContent = text && text.trim() ? '✅ 辨識完成！請檢查文字，再填入下方欄位' : '沒有辨識到文字，換一張清楚一點的照片試試';
    }).catch(() => {
      status.textContent = '⚠️ 辨識失敗，請確認網路連線或換一張照片';
    });
  });
}
function saveNewWord(){
  const fr = document.getElementById('nwFr').value.trim();
  const cn = document.getElementById('nwCn').value.trim();
  if(!fr || !cn){ alert('至少要填法文與中文喔'); return; }
  const item = {
    id: 'c' + Date.now(),
    cat: document.getElementById('nwCat').value,
    french: fr,
    pos: document.getElementById('nwPos').value.trim(),
    chinese: cn,
    english: document.getElementById('nwEn').value.trim(),
    example: document.getElementById('nwEx').value.trim(),
  };
  customVocab.push(item);
  saveAll();
  closeModal();
  cardState.pool=[];
  renderCards();
}

function getFrenchVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
}
function pickBestFrenchVoice(voices){
  if(!voices.length) return null;
  // 常見系統內建的道地法文語音名稱關鍵字（依優先順序）
  const preferred = ['thomas','audrey','amelie','amélie','aurelie','aurélie','chantal','celine','céline',
    'virginie','marie','google français','google francais','microsoft henri','microsoft julie','ines'];
  for(const key of preferred){
    const found = voices.find(v => v.name.toLowerCase().includes(key));
    if(found) return found;
  }
  const frFR = voices.find(v => v.lang.toLowerCase()==='fr-fr');
  if(frFR) return frFR;
  return voices[0];
}
function speakFr(text, rate){
  if(!('speechSynthesis' in window)){ alert('此瀏覽器不支援語音朗讀'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; u.rate = rate || 0.85;
  const voices = getFrenchVoices();
  let voice = prefs.voiceName ? voices.find(v => v.name === prefs.voiceName) : null;
  if(!voice) voice = pickBestFrenchVoice(voices);
  if(voice) u.voice = voice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
function populateVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if(!sel) return;
  const voices = getFrenchVoices();
  if(voices.length===0){
    sel.innerHTML = '<option value="">（目前找不到法文語音，稍後再開啟或安裝語音包後重試）</option>';
    return;
  }
  sel.innerHTML = voices.map(v =>
    `<option value="${escapeHtml(v.name)}" ${prefs.voiceName===v.name?'selected':''}>${escapeHtml(v.name)}（${escapeHtml(v.lang)}）</option>`
  ).join('');
  if(!prefs.voiceName || !voices.find(v=>v.name===prefs.voiceName)){
    const best = pickBestFrenchVoice(voices);
    if(best){ sel.value = best.name; prefs.voiceName = best.name; saveAll(); }
  }
}
function saveVoiceChoice(){
  const sel = document.getElementById('voiceSelect');
  if(!sel) return;
  prefs.voiceName = sel.value;
  saveAll();
}

function levenshtein(a, b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...new Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function similarityScore(a, b){
  a = normalizeStr(a, true); b = normalizeStr(b, true);
  if(!a.length && !b.length) return 100;
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length, 1);
  return Math.max(0, Math.round((1 - dist/maxLen) * 100));
}

function checkDictation(){
  const w = practiceState.current;
  const val = document.getElementById('dictInput').value;
  const ok = normalizeStr(val, prefs.ignoreAccents) === normalizeStr(w.french, prefs.ignoreAccents);
  const fb = document.getElementById('pFeedback');
  if(ok){
    practiceState.streak++;
    fb.innerHTML = `<div class="feedback ok">✅ 正確！${escapeHtml(w.french)}</div>`;
    setTimeout(()=>{ nextPracticeItem(); document.querySelector('#view-practice > div:last-child').textContent = '連續答對：'+practiceState.streak+' 🔥'; }, 900);
  } else {
    practiceState.streak = 0;
    fb.innerHTML = `<div class="feedback no">❌ 正確答案是：<b>${escapeHtml(w.french)}</b>（你輸入：${escapeHtml(val||'(空白)')}）</div>
      <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="nextPracticeItem()">下一題</button>`;
  }
}
function revealAnswer(){
  const w = practiceState.current;
  document.getElementById('pFeedback').innerHTML = `<div class="feedback ok">答案：<b>${escapeHtml(w.french)}</b></div>
    <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="nextPracticeItem()">下一題</button>`;
}
function checkSentence(){
  const w = practiceState.current;
  const val = document.getElementById('sentInput').value.trim();
  const fb = document.getElementById('pFeedback');
  if(!val){ fb.innerHTML = `<div class="feedback no">先寫一句看看吧！</div>`; return; }
  const stem = normalizeStr(w.french.split(' ')[0].replace(/^(se |s'|l'|le |la |les |un |une |des )/,''), true);
  const hasWord = normalizeStr(val, true).includes(stem);
  const longEnough = val.split(' ').length >= 3;
  let msg = '';
  if(hasWord && longEnough) msg = `<div class="feedback ok">✅ 看起來有包含目標字，句子長度也 OK！點「顯示範例例句」跟自己的句子比對文法。</div>`;
  else if(!hasWord) msg = `<div class="feedback no">⚠️ 好像沒看到「${escapeHtml(w.french)}」這個字／字根，再檢查一下？</div>`;
  else msg = `<div class="feedback no">⚠️ 句子可以再完整一點喔（至少主詞＋動詞）。</div>`;
  fb.innerHTML = msg;
}
function revealExample(){
  const w = practiceState.current;
  const ex = w.example || w.present || '（此項目沒有附例句）';
  document.getElementById('pFeedback').innerHTML = `<div class="feedback ok">📘 範例例句：<br><b>${escapeHtml(ex)}</b></div>
    <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="nextPracticeItem()">換下一個</button>`;
}

/* ============================================================
   3) READING
   ============================================================ */
let readingState = { openId: null };

function renderReadingList(){
  const arts = allArticles();
  let html = arts.map(a => {
    const n = (notesStore[a.id]||[]).length;
    const meta = a.type==='link' ? `🔗 外部連結・${escapeHtml(a.source||'')}　·　${n} 則筆記` : `${a.text.length} 字　·　${n} 則筆記`;
    return `<div class="article-item" onclick="openArticle('${a.id}')">
      <div class="t">${a.type==='link'?'🔗 ':''}${escapeHtml(a.title)}</div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('');
  if(arts.length===0) html = '<div class="empty-hint">還沒有文章，點右下角＋新增一篇</div>';
  document.getElementById('view-reading').innerHTML = html + `<button class="fab" onclick="openAddArticleModal()">＋</button>`;
}

function openArticle(id){
  readingState.openId = id;
  renderArticleDetail();
}

// Robust selection capture: listens globally, checks the selection sits inside #artText.
// This works far more reliably on mobile than mouseup/touchend, which can fire before
// the browser has finished resolving a drag-handle text selection.
let selectionWatcherBound = false;
function bindSelectionWatcher(){
  if(selectionWatcherBound) return;
  selectionWatcherBound = true;
  document.addEventListener('selectionchange', () => {
    const artText = document.getElementById('artText');
    const quoteInput = document.getElementById('quoteInput');
    if(!artText || !quoteInput) return;
    const sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return;
    const text = sel.toString().trim();
    if(!text) return;
    const range = sel.getRangeAt(0);
    if(artText.contains(range.commonAncestorContainer)){
      quoteInput.value = text;
    }
  });
}

function renderArticleDetail(){
  const a = allArticles().find(x=>x.id===readingState.openId);
  if(!a){ renderReadingList(); return; }
  const notes = notesStore[a.id] || [];
  const isLink = a.type === 'link';
  const html = `
    <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="readingState.openId=null; renderReadingList();">‹ 返回文章列表</button>
    <h2 class="section-title">${escapeHtml(a.title)}</h2>
    ${isLink ? `
      <div class="card">
        <div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">來源：${escapeHtml(a.source||'')}</div>
        <div style="font-size:13.5px; margin-bottom:12px; line-height:1.7;">${escapeHtml(a.desc||'')}</div>
        <a class="btn btn-primary" style="display:block; text-align:center; text-decoration:none;" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">🔗 前往原文閱讀</a>
      </div>
    ` : `
      <div class="article-body" id="artText">${escapeHtml(a.text)}</div>
    `}
    <div class="sel-panel">
      <div>✏️ ${isLink? '讀完後，把想記錄的句子貼在下面（可直接從其他 App 貼上）' : '選取上方文字會自動帶入下面的引用欄，也可以直接手動輸入或貼上'}</div>
      <label class="field-label" style="margin-top:8px;">引用句子（可留空）</label>
      <input type="text" id="quoteInput" placeholder="要引用的句子...">
      <label class="field-label">筆記內容</label>
      <textarea id="noteInput" rows="2" placeholder="寫下你的筆記、文法問題、心得..."></textarea>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="addNoteFromSelection()">＋ 加筆記</button>
    </div>
    <h2 class="section-title">📌 筆記（${notes.length}）</h2>
    <div id="noteList">
      ${notes.length? notes.map((n,i)=>`
        <div class="note-item">
          <button class="del" onclick="deleteNote(${i})">刪除</button>
          ${n.quote?`<div class="quote">「${escapeHtml(n.quote)}」</div>`:''}
          <div class="txt">${escapeHtml(n.note)}</div>
        </div>`).join('') : '<div class="empty-hint">還沒有筆記</div>'}
    </div>
  `;
  document.getElementById('view-reading').innerHTML = html;
  bindSelectionWatcher();
}
function addNoteFromSelection(){
  const quote = document.getElementById('quoteInput').value.trim();
  const note = document.getElementById('noteInput').value.trim();
  if(!note){ alert('筆記內容不能是空的喔'); return; }
  const id = readingState.openId;
  if(!notesStore[id]) notesStore[id] = [];
  notesStore[id].push({quote, note, ts: Date.now()});
  saveAll();
  renderArticleDetail();
}
function deleteNote(i){
  notesStore[readingState.openId].splice(i,1);
  saveAll();
  renderArticleDetail();
}
function openAddArticleModal(){
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>➕ 新增文章</h3>
    <label class="field-label">標題</label><input type="text" id="artTitle" placeholder="文章標題">
    <label class="field-label">內文（貼上文字即可）</label><textarea id="artBody" rows="8" placeholder="貼上法文文章內容..."></textarea>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveNewArticle()">儲存</button>
    </div>
  `);
}
function saveNewArticle(){
  const title = document.getElementById('artTitle').value.trim();
  const text = document.getElementById('artBody').value.trim();
  if(!title || !text){ alert('標題與內文都要填喔'); return; }
  customArticles.push({id:'ca'+Date.now(), title, text, type:'text'});
  saveAll();
  closeModal();
  renderReadingList();
}

/* ============================================================
   4) QUIZ
   ============================================================ */
let quizState = { questions:[], idx:0, score:0, wrong:[], answered:false };

function renderQuizSetup(){
  document.getElementById('view-quiz').innerHTML = `
    <div class="card">
      <h2 class="section-title">測驗設定</h2>
      <label class="field-label">題目來源</label>
      <select id="qSource"><option value="vocab">單字庫</option><option value="verb">動詞句型庫</option><option value="all">全部</option></select>
      <label class="field-label">分類（可選）</label>
      <select id="qCat"><option value="ALL">不限分類</option>${vocabCategories().map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>
      <label class="field-label">出題方向</label>
      <select id="qDir"><option value="fr2cn">看法文，選中／英文意思</option><option value="cn2fr">看中文，選法文</option></select>
      <label class="field-label">題數</label>
      <select id="qCount"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select>
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="startQuiz()">開始測驗</button>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${quizHistory.played}</div><div class="lbl">已測驗題數</div></div>
      <div class="stat-box"><div class="num">${quizHistory.total? Math.round(quizHistory.correct/quizHistory.total*100):0}%</div><div class="lbl">歷史正確率</div></div>
    </div>
  `;
}
function startQuiz(){
  const source = document.getElementById('qSource').value;
  const cat = document.getElementById('qCat').value;
  const dir = document.getElementById('qDir').value;
  const count = parseInt(document.getElementById('qCount').value);
  let pool = allPoolForPractice(source).filter(x=>x.french && (x.chinese||x.english));
  if(cat!=='ALL') pool = pool.filter(x=>x.cat===cat);
  if(pool.length < 4){ alert('這個範圍的題目太少了（至少需要4個），換個範圍試試'); return; }
  pool = shuffle(pool).slice(0, Math.min(count, pool.length));
  quizState.questions = pool.map(w=>({item:w, dir}));
  quizState.idx = 0; quizState.score = 0; quizState.wrong = []; quizState.answered=false;
  renderQuiz();
}
function meaningOf(w){ return [w.chinese, w.english].filter(Boolean).join(' / '); }
function renderQuiz(){
  const q = quizState.questions[quizState.idx];
  if(!q){ renderQuizResult(); return; }
  const w = q.item;
  const wholePool = allPoolForPractice('all');
  let distractors = shuffle(wholePool.filter(x=>x.french!==w.french && (x.chinese||x.english))).slice(0,3);
  const options = shuffle([w, ...distractors]);
  const letters = ['A','B','C','D'];
  const promptText = q.dir==='fr2cn' ? w.french : meaningOf(w);
  quizState.answered = false;
  document.getElementById('view-quiz').innerHTML = `
    <div class="quiz-meta"><span>第 ${quizState.idx+1} / ${quizState.questions.length} 題</span><span>得分 ${quizState.score}</span></div>
    <div class="card">
      <div class="quiz-q">${escapeHtml(promptText)}</div>
      ${options.map((o,i)=>`<button class="quiz-opt" id="opt${i}" onclick="answerQuiz(${i})">
        <span class="letter">${letters[i]}</span>${escapeHtml(q.dir==='fr2cn'? meaningOf(o) : o.french)}
      </button>`).join('')}
      <div id="quizFeedback"></div>
    </div>
  `;
  quizState._correctIdx = options.findIndex(o=>o.french===w.french);
  quizState._options = options;
}
function answerQuiz(i){
  if(quizState.answered) return;
  quizState.answered = true;
  const correct = i === quizState._correctIdx;
  const w = quizState.questions[quizState.idx].item;
  document.getElementById('opt'+quizState._correctIdx).classList.add('correct');
  if(!correct) document.getElementById('opt'+i).classList.add('wrong');
  if(correct) quizState.score++;
  else quizState.wrong.push(w);
  quizHistory.played++; quizHistory.total++; if(correct) quizHistory.correct++;
  saveAll();
  const ex = w.example || w.present || '';
  document.getElementById('quizFeedback').innerHTML = `
    <div class="quiz-explain">${correct?'✅ 答對了！':'❌ 答錯了，正確答案已標綠。'}　
    <b>${escapeHtml(w.french)}</b> — ${escapeHtml(meaningOf(w))}${ex?'<br>例句：'+escapeHtml(ex):''}</div>
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="nextQuiz()">${quizState.idx+1<quizState.questions.length?'下一題':'看結果'}</button>
  `;
}
function nextQuiz(){ quizState.idx++; renderQuiz(); }
function renderQuizResult(){
  const total = quizState.questions.length;
  document.getElementById('view-quiz').innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:15px; color:var(--muted);">測驗結果</div>
      <div style="font-size:36px; font-weight:800; color:var(--primary-light); margin:8px 0;">${quizState.score} / ${total}</div>
      <div style="color:var(--muted); font-size:13px;">正確率 ${Math.round(quizState.score/total*100)}%</div>
    </div>
    ${quizState.wrong.length? `<h2 class="section-title">答錯的題目</h2><div class="card">${quizState.wrong.map(w=>`
      <div class="result-row"><span>${escapeHtml(w.french)}</span><span style="color:var(--muted);">${escapeHtml(meaningOf(w))}</span></div>
    `).join('')}</div>` : ''}
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="renderQuizSetup()">回到測驗設定</button>
  `;
}

/* ============================================================
   5) ME / SETTINGS
   ============================================================ */
function renderMe(){
  const mastered = Object.values(progress).filter(p=>p.box>=5).length;
  document.getElementById('view-me').innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${allVocab().length}</div><div class="lbl">單字總數</div></div>
      <div class="stat-box"><div class="num">${customVocab.length}</div><div class="lbl">我新增的單字</div></div>
      <div class="stat-box"><div class="num">${mastered}</div><div class="lbl">已熟記單字</div></div>
      <div class="stat-box"><div class="num">${allArticles().length}</div><div class="lbl">文章篇數</div></div>
    </div>
    <div class="card">
      <h2 class="section-title">🔊 語音朗讀設定</h2>
      <div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">
        如果目前的發音聽起來不夠道地，可以在這裡換一個手機內建的法文語音。清單內容依你手機系統安裝的語音而定。
      </div>
      <select id="voiceSelect" onchange="saveVoiceChoice()"></select>
      <button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="testVoice()">🔊 測試發音</button>
      <div style="font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.6;">
        找不到理想的聲音嗎？iPhone：「設定」→「輔助使用」→「朗讀內容」→「聲音」→下載更多法文語音；Android：「設定」→「文字轉語音輸出」→安裝法文語音包。裝好後回到這裡重新整理清單就會出現。
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">練習設定</h2>
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px;">
        <input type="checkbox" id="ignoreAccentsChk" ${prefs.ignoreAccents?'checked':''} onchange="toggleIgnoreAccents()">
        拼寫檢查時忽略重音符號（é/è/ê 視為相同）
      </label>
    </div>
    <div class="card">
      <h2 class="section-title">資料備份</h2>
      <div style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">
        本 App 的資料（新增單字、文章、筆記、學習進度）都儲存在你手機瀏覽器的本機空間裡。清除瀏覽器資料會導致資料遺失，建議定期匯出備份。
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="exportBackup()">匯出備份</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">匯入備份</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importBackup(event)">
    </div>
    <div class="card">
      <h2 class="section-title">加入手機主畫面</h2>
      <div style="font-size:12.5px; color:var(--muted); line-height:1.7;">
        iPhone：用 Safari 開啟此頁 → 按下方「分享」按鈕 → 「加入主畫面」<br>
        Android：用 Chrome 開啟此頁 → 右上角選單 → 「新增至主畫面」<br>
        加入後即可像 App 一樣點圖示開啟，離線也能使用（語音朗讀功能需要系統內建的法文語音）。
      </div>
    </div>
    <div class="card">
      <button class="btn btn-bad" style="width:100%;" onclick="resetProgress()">重設學習進度</button>
    </div>
  `;
  populateVoiceSelect();
}
function toggleIgnoreAccents(){ prefs.ignoreAccents = document.getElementById('ignoreAccentsChk').checked; saveAll(); }
function exportBackup(){
  const data = {customVocab, customArticles, notesStore, progress, quizHistory, prefs, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fr_app_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      customVocab = data.customVocab || [];
      customArticles = data.customArticles || [];
      notesStore = data.notesStore || {};
      progress = data.progress || {};
      quizHistory = data.quizHistory || {played:0,correct:0,total:0};
      prefs = data.prefs || {ignoreAccents:false};
      saveAll();
      alert('匯入成功！');
      renderMe();
    }catch(err){ alert('檔案格式錯誤，匯入失敗'); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm('確定要清空所有學習進度（不包含新增的單字／文章）嗎？')) return;
  progress = {}; quizHistory = {played:0,correct:0,total:0};
  saveAll();
  renderMe();
}
