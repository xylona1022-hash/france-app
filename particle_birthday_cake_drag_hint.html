<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gâteau d'Anniversaire Interactif en 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Caveat:wght@600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            overflow: hidden;
            background-color: #030208;
            font-family: 'Quicksand', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            color: #ffffff;
            touch-action: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.2px;
            display: inline-block;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* 3D Interaction Drag Hint Badge */
        .drag-hint {
            background: rgba(10, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(76, 201, 240, 0.35);
            color: #4cc9f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { border-color: rgba(76, 201, 240, 0.35); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
            50% { border-color: rgba(76, 201, 240, 0.8); box-shadow: 0 0 15px rgba(76, 201, 240, 0.4); }
        }

        /* Initial Blue Cursive Text Overlay */
        #intro-cursive-title {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-family: 'Dancing Script', cursive;
            font-size: 64px;
            color: #4cc9f0;
            text-shadow: 0 0 20px rgba(76, 201, 240, 0.8), 0 0 40px rgba(76, 201, 240, 0.4);
            pointer-events: none;
            text-align: center;
            transition: opacity 0.8s ease;
            white-space: nowrap;
        }

        /* Wish Popup Banner at Step 3 */
        #wish-prompt-banner {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            width: calc(100% - 40px);
            max-width: 580px;
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(76, 201, 240, 0.5);
            padding: 16px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(76, 201, 240, 0.3);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease, transform 0.8s ease;
        }
        #wish-prompt-banner.active {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }
        .wish-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffd166;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(255, 209, 102, 0.5);
        }
        .wish-text {
            font-size: 15px;
            line-height: 1.5;
            color: #f8f9fa;
        }

        /* Bottom Step Control Bar */
        #bottom-bar {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(15, 10, 30, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 215, 0, 0.2);
            width: calc(100% - 40px);
            max-width: 480px;
        }

        .step-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.3), rgba(255, 105, 180, 0.3));
            border: 1px solid #4cc9f0;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.25);
            text-align: center;
            white-space: nowrap;
        }

        .step-btn:hover, .step-btn:active {
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.6), rgba(255, 105, 180, 0.6));
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.7);
            transform: scale(1.02);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ddd;
            padding: 12px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-overlay">
        <div class="badge">🎂 Joyeux Anniversaire</div>
        <!-- Drag interaction hint in French -->
        <div class="drag-hint">👆 Glissez le doigt ou la souris pour faire pivoter en 3D</div>
    </div>

    <!-- Initial Blue Cursive Text -->
    <div id="intro-cursive-title">Bon anniversaire, Raphaël</div>

    <!-- French Wish Prompt Banner (Appears at Step 3) -->
    <div id="wish-prompt-banner">
        <div class="wish-title">✨ Fais tes vœux ✨</div>
        <div class="wish-text">Tu peux maintenant faire <strong>trois vœux</strong> : deux à voix haute et un secret... Ils se réaliseront tous ! 🌟</div>
    </div>

    <div id="bottom-bar">
        <button id="next-step-btn" class="step-btn">✨ 1. Assembler le gâteau</button>
        <button id="reset-btn" class="reset-btn">🔄 Réinitialiser</button>
    </div>

    <div id="webgl-container"></div>

    <script>
        // --- 1. Global Setup & Variables ---
        let scene, camera, renderer, controls;
        let particleSystem, particleGeo;
        let candleGroup, flameGroup, flameGeo;
        let cardGroup, coverPivot;
        let explosionParticles = [], explosionGroup;

        const PARTICLE_COUNT = 9500;
        let cakePositions = new Float32Array(PARTICLE_COUNT * 3);
        let dispersedPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        let particleColors = new Float32Array(PARTICLE_COUNT * 3);
        let explodedPositions = new Float32Array(PARTICLE_COUNT * 3);

        let currentStep = 0;
        let targetAssembleRatio = 0;
        let currentAssembleRatio = 0;
        let cardOpenProgress = 0;
        let targetCardOpen = 0;
        let audioContext;

        const buttonTexts = [
            "✨ 1. Assembler le gâteau",
            "🕯️ 2. Placer les bougies",
            "🔥 3. Allumer & Musique",
            "💥 4. Exploser & Carte",
            "🎉 Expérience terminée"
        ];

        // --- 2. Generate Teal Cake Particles ---
        function generateCakeParticles() {
            let pIndex = 0;

            function addParticle(x, y, z, color) {
                if (pIndex >= PARTICLE_COUNT) return;
                
                cakePositions[pIndex * 3] = x;
                cakePositions[pIndex * 3 + 1] = y;
                cakePositions[pIndex * 3 + 2] = z;

                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 7 + Math.random() * 11;

                dispersedPositions[pIndex * 3] = r * Math.sin(phi) * Math.cos(theta);
                dispersedPositions[pIndex * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                dispersedPositions[pIndex * 3 + 2] = r * Math.cos(phi);

                const expR = 15 + Math.random() * 20;
                explodedPositions[pIndex * 3] = expR * Math.sin(phi) * Math.cos(theta);
                explodedPositions[pIndex * 3 + 1] = expR * Math.sin(phi) * Math.sin(theta);
                explodedPositions[pIndex * 3 + 2] = expR * Math.cos(phi);

                currentPositions[pIndex * 3] = dispersedPositions[pIndex * 3];
                currentPositions[pIndex * 3 + 1] = dispersedPositions[pIndex * 3 + 1];
                currentPositions[pIndex * 3 + 2] = dispersedPositions[pIndex * 3 + 2];

                particleColors[pIndex * 3] = color.r;
                particleColors[pIndex * 3 + 1] = color.g;
                particleColors[pIndex * 3 + 2] = color.b;

                pIndex++;
            }

            const colorPlate = new THREE.Color(0xd8e2dc);
            const colorTealDark = new THREE.Color(0x008080);
            const colorTealMain = new THREE.Color(0x2a9d8f);
            const colorTealLight = new THREE.Color(0x48cae4);
            const colorCreamWhite = new THREE.Color(0xf8f9fa);
            const colorGoldAccent = new THREE.Color(0xffd166);

            // Plate
            for (let i = 0; i < 1600; i++) {
                const r = Math.sqrt(Math.random()) * 3.8;
                const theta = Math.random() * Math.PI * 2;
                addParticle(r * Math.cos(theta), -1.6 + (Math.random() - 0.5) * 0.1, r * Math.sin(theta), colorPlate);
            }

            // Bottom Tier
            for (let i = 0; i < 3200; i++) {
                const isSurface = Math.random() > 0.3;
                const r = isSurface ? (2.4 + Math.random() * 0.4) : Math.sqrt(Math.random()) * 2.8;
                const theta = Math.random() * Math.PI * 2;
                const y = -1.5 + Math.random() * 1.0;
                
                const col = (y > -0.7) ? colorCreamWhite : colorTealDark;
                addParticle(r * Math.cos(theta), y, r * Math.sin(theta), col);
            }

            // Top Tier
            for (let i = 0; i < 2700; i++) {
                const isSurface = Math.random() > 0.3;
                const r = isSurface ? (1.5 + Math.random() * 0.3) : Math.sqrt(Math.random()) * 1.8;
                const theta = Math.random() * Math.PI * 2;
                const y = -0.5 + Math.random() * 0.9;

                const col = (y > 0.2) ? colorCreamWhite : colorTealLight;
                addParticle(r * Math.cos(theta), y, r * Math.sin(theta), col);
            }

            // Floating Particles
            const remaining = PARTICLE_COUNT - pIndex;
            for (let i = 0; i < remaining; i++) {
                const r = 3.2 + Math.random() * 1.8;
                const theta = Math.random() * Math.PI * 2;
                const col = Math.random() > 0.5 ? colorGoldAccent : colorTealMain;
                addParticle(r * Math.cos(theta), -1.0 + Math.random() * 2.8, r * Math.sin(theta), col);
            }
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.35, 'rgba(180, 240, 255, 0.85)');
            grad.addColorStop(0.7, 'rgba(42, 157, 143, 0.25)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. Scene Setup ---
        function initScene() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030208, 0.025);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.0, 8.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.minDistance = 3.5;
            controls.maxDistance = 15;

            const ambientLight = new THREE.AmbientLight(0x334455, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
            dirLight.position.set(4, 8, 6);
            scene.add(dirLight);

            // Cake Particles
            generateCakeParticles();

            particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.12,
                map: createGlowTexture(),
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            // Initialize 25 White Candles & Flames
            init25WhiteCandles();

            // Initialize Smaller 3D Folding Card
            init3DFoldingCard();

            explosionGroup = new THREE.Group();
            scene.add(explosionGroup);

            window.addEventListener('resize', onWindowResize);
        }

        // --- 4. Build 25 WHITE Candles ---
        function init25WhiteCandles() {
            candleGroup = new THREE.Group();
            flameGroup = new THREE.Group();

            const candleGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.5, 12);
            const candleMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.1,
                metalness: 0.1
            });

            const candleCoords = [];
            const r1 = 0.6, count1 = 8;
            for (let i = 0; i < count1; i++) {
                const angle = (i / count1) * Math.PI * 2;
                candleCoords.push({ x: r1 * Math.cos(angle), z: r1 * Math.sin(angle) });
            }

            const r2 = 1.35, count2 = 17;
            for (let i = 0; i < count2; i++) {
                const angle = (i / count2) * Math.PI * 2;
                candleCoords.push({ x: r2 * Math.cos(angle), z: r2 * Math.sin(angle) });
            }

            candleCoords.forEach((pt) => {
                const mesh = new THREE.Mesh(candleGeo, candleMat);
                mesh.position.set(pt.x, 0.65, pt.z);
                candleGroup.add(mesh);

                const light = new THREE.PointLight(0xffaa33, 0, 3);
                light.position.set(pt.x, 0.95, pt.z);
                candleGroup.add(light);
            });

            candleGroup.visible = false;
            scene.add(candleGroup);

            // Flames
            const flameCount = 200;
            const flamePos = new Float32Array(flameCount * 3);
            const flameCols = new Float32Array(flameCount * 3);

            const cCore = new THREE.Color(0xffffff);
            const cFlame = new THREE.Color(0xff6600);

            for (let i = 0; i < flameCount; i++) {
                const candleIdx = i % 25;
                const pt = candleCoords[candleIdx];

                flamePos[i * 3] = pt.x + (Math.random() - 0.5) * 0.04;
                flamePos[i * 3 + 1] = 0.93 + Math.random() * 0.15;
                flamePos[i * 3 + 2] = pt.z + (Math.random() - 0.5) * 0.04;

                const col = Math.random() > 0.3 ? cFlame : cCore;
                flameCols[i * 3] = col.r;
                flameCols[i * 3 + 1] = col.g;
                flameCols[i * 3 + 2] = col.b;
            }

            flameGeo = new THREE.BufferGeometry();
            flameGeo.setAttribute('position', new THREE.BufferAttribute(flamePos, 3));
            flameGeo.setAttribute('color', new THREE.BufferAttribute(flameCols, 3));

            const flameMat = new THREE.PointsMaterial({
                size: 0.14,
                map: createGlowTexture(),
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const flamesPoints = new THREE.Points(flameGeo, flameMat);
            flameGroup.add(flamesPoints);
            flameGroup.visible = false;
            scene.add(flameGroup);
        }

        // --- 5. Build Smaller 3D Folding/Opening Card with French Wishes ---
        function createCardFrontTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 768;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#112233');
            grad.addColorStop(1, '#081420');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#2a9d8f';
            ctx.lineWidth = 14;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

            ctx.fillStyle = '#4cc9f0';
            ctx.font = 'bold 58px "Dancing Script", cursive';
            ctx.textAlign = 'center';
            ctx.fillText('Bon Anniversaire', canvas.width / 2, 420);

            ctx.fillStyle = '#ffd166';
            ctx.font = 'bold 46px "Quicksand", sans-serif';
            ctx.fillText('Raphaël', canvas.width / 2, 510);

            ctx.fillStyle = '#ffffff';
            ctx.font = '60px "Segoe UI"';
            ctx.fillText('💌', canvas.width / 2, 650);

            return new THREE.CanvasTexture(canvas);
        }

        function createCardInsideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 768;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#fffcf7');
            grad.addColorStop(1, '#f3ebd9');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#2a9d8f';
            ctx.lineWidth = 8;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

            ctx.textAlign = 'center';
            
            ctx.fillStyle = '#008080';
            ctx.font = 'bold 46px "Dancing Script", cursive';
            ctx.fillText('Cher Raphaël,', canvas.width / 2, 160);

            ctx.fillStyle = '#222222';
            ctx.font = '500 24px "Quicksand", sans-serif';

            const lines = [
                "Joyeux anniversaire !",
                "",
                "Que cette nouvelle année t'apporte",
                "beaucoup de bonheur, de sérénité",
                "et de joie au quotidien.",
                "Profite pleinement de chaque instant !",
                "",
                "Je te souhaite aussi de réussir",
                "et de finaliser très bientôt la superbe",
                "application que tu es en train de concevoir. 🚀✨",
                "",
                "Plein de succès !"
            ];

            let startY = 240;
            lines.forEach((line) => {
                if (line.includes("Joyeux anniversaire")) {
                    ctx.fillStyle = '#e63946';
                    ctx.font = 'bold 30px "Quicksand", sans-serif';
                } else if (line.includes("application")) {
                    ctx.fillStyle = '#0077b6';
                    ctx.font = 'bold 24px "Quicksand", sans-serif';
                } else {
                    ctx.fillStyle = '#333333';
                    ctx.font = '500 23px "Quicksand", sans-serif';
                }
                ctx.fillText(line, canvas.width / 2, startY);
                startY += 48;
            });

            return new THREE.CanvasTexture(canvas);
        }

        function init3DFoldingCard() {
            cardGroup = new THREE.Group();

            const cWidth = 2.1;
            const cHeight = 2.8;
            const thickness = 0.02;

            const frontTex = createCardFrontTexture();
            const insideTex = createCardInsideTexture();

            const backGeo = new THREE.BoxGeometry(cWidth, cHeight, thickness);
            const backMats = [
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ map: insideTex, roughness: 0.2 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 })
            ];
            const backMesh = new THREE.Mesh(backGeo, backMats);
            backMesh.position.set(0, 0, -thickness / 2);
            cardGroup.add(backMesh);

            coverPivot = new THREE.Group();
            coverPivot.position.set(-cWidth / 2, 0, 0);
            cardGroup.add(coverPivot);

            const coverGeo = new THREE.BoxGeometry(cWidth, cHeight, thickness);
            coverGeo.translate(cWidth / 2, 0, 0);

            const coverMats = [
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ color: 0x081420 }),
                new THREE.MeshStandardMaterial({ map: frontTex, roughness: 0.2 }),
                new THREE.MeshStandardMaterial({ color: 0xfffcf7, roughness: 0.3 })
            ];

            const coverMesh = new THREE.Mesh(coverGeo, coverMats);
            coverPivot.add(coverMesh);

            cardGroup.position.set(0, 0.3, 0);
            cardGroup.scale.set(0, 0, 0);
            scene.add(cardGroup);
        }

        // --- 6. Fireworks Explosion ---
        function triggerFireworkExplosion() {
            const count = 400;
            const expGeo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const velocities = [];

            const colorPalette = [
                new THREE.Color(0x2a9d8f),
                new THREE.Color(0x48cae4),
                new THREE.Color(0xffd166),
                new THREE.Color(0xff4d6d),
                new THREE.Color(0xffffff)
            ];

            for (let i = 0; i < count; i++) {
                pos[i * 3] = 0;
                pos[i * 3 + 1] = 0.5;
                pos[i * 3 + 2] = 0;

                const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = 0.15 + Math.random() * 0.2;

                velocities.push(new THREE.Vector3(
                    speed * Math.sin(phi) * Math.cos(theta),
                    speed * Math.sin(phi) * Math.sin(theta),
                    speed * Math.cos(phi)
                ));
            }

            expGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            expGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const expMat = new THREE.PointsMaterial({
                size: 0.2,
                map: createGlowTexture(),
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const expPoints = new THREE.Points(expGeo, expMat);
            explosionGroup.add(expPoints);

            explosionParticles.push({
                points: expPoints,
                velocities: velocities,
                life: 1.0
            });
        }

        function updateExplosions() {
            explosionParticles.forEach((exp, eIdx) => {
                exp.life -= 0.018;
                const pos = exp.points.geometry.attributes.position.array;

                for (let i = 0; i < exp.velocities.length; i++) {
                    pos[i * 3] += exp.velocities[i].x;
                    pos[i * 3 + 1] += exp.velocities[i].y;
                    pos[i * 3 + 2] += exp.velocities[i].z;

                    exp.velocities[i].y -= 0.002;
                }
                exp.points.geometry.attributes.position.needsUpdate = true;
                exp.points.material.opacity = Math.max(0, exp.life);

                if (exp.life <= 0) {
                    explosionGroup.remove(exp.points);
                    explosionParticles.splice(eIdx, 1);
                }
            });
        }

        // --- 7. Web Audio Synthesized French "Joyeux Anniversaire" Melody ---
        function playFrenchBirthdayMelody() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioContext.resume();

            const notes = [
                { f: 392, d: 0.35 }, { f: 392, d: 0.35 }, { f: 440, d: 0.7 }, { f: 392, d: 0.7 }, { f: 523.25, d: 0.7 }, { f: 493.88, d: 1.2 },
                { f: 392, d: 0.35 }, { f: 392, d: 0.35 }, { f: 440, d: 0.7 }, { f: 392, d: 0.7 }, { f: 587.33, d: 0.7 }, { f: 523.25, d: 1.2 },
                { f: 392, d: 0.35 }, { f: 392, d: 0.35 }, { f: 783.99, d: 0.7 }, { f: 659.25, d: 0.7 }, { f: 523.25, d: 0.7 }, { f: 493.88, d: 0.7 }, { f: 440, d: 1.0 },
                { f: 698.46, d: 0.35 }, { f: 698.46, d: 0.35 }, { f: 659.25, d: 0.7 }, { f: 523.25, d: 0.7 }, { f: 587.33, d: 0.7 }, { f: 523.25, d: 1.4 }
            ];

            let currTime = audioContext.currentTime + 0.1;

            notes.forEach(note => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(note.f, currTime);

                gain.gain.setValueAtTime(0.15, currTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, currTime + note.d - 0.05);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start(currTime);
                osc.stop(currTime + note.d);

                currTime += note.d;
            });
        }

        // --- 8. Step Controller Logic ---
        function advanceStep() {
            if (currentStep < 4) {
                currentStep++;
            } else {
                return;
            }

            updateStepState();
        }

        function resetAll() {
            currentStep = 0;
            updateStepState();
        }

        function updateStepState() {
            document.getElementById('next-step-btn').innerText = buttonTexts[currentStep];

            const titleEl = document.getElementById('intro-cursive-title');
            const wishBanner = document.getElementById('wish-prompt-banner');

            switch (currentStep) {
                case 0:
                    targetAssembleRatio = 0;
                    particleSystem.material.opacity = 1.0;
                    candleGroup.visible = false;
                    flameGroup.visible = false;
                    cardGroup.scale.set(0, 0, 0);
                    targetCardOpen = 0;
                    if (titleEl) titleEl.style.opacity = '1';
                    if (wishBanner) wishBanner.classList.remove('active');
                    break;

                case 1:
                    targetAssembleRatio = 1.0;
                    particleSystem.material.opacity = 1.0;
                    candleGroup.visible = false;
                    flameGroup.visible = false;
                    cardGroup.scale.set(0, 0, 0);
                    targetCardOpen = 0;
                    if (titleEl) titleEl.style.opacity = '0';
                    if (wishBanner) wishBanner.classList.remove('active');
                    break;

                case 2:
                    targetAssembleRatio = 1.0;
                    particleSystem.material.opacity = 1.0;
                    candleGroup.visible = true;
                    flameGroup.visible = false;
                    cardGroup.scale.set(0, 0, 0);
                    targetCardOpen = 0;
                    if (titleEl) titleEl.style.opacity = '0';
                    if (wishBanner) wishBanner.classList.remove('active');
                    break;

                case 3:
                    targetAssembleRatio = 1.0;
                    particleSystem.material.opacity = 1.0;
                    candleGroup.visible = true;
                    candleGroup.children.forEach(child => {
                        if (child.isPointLight) child.intensity = 1.2;
                    });
                    flameGroup.visible = true;
                    playFrenchBirthdayMelody();
                    cardGroup.scale.set(0, 0, 0);
                    targetCardOpen = 0;
                    if (titleEl) titleEl.style.opacity = '0';
                    if (wishBanner) wishBanner.classList.add('active');
                    break;

                case 4:
                    targetAssembleRatio = 2.0;
                    candleGroup.visible = false;
                    flameGroup.visible = false;
                    if (titleEl) titleEl.style.opacity = '0';
                    if (wishBanner) wishBanner.classList.remove('active');

                    triggerFireworkExplosion();
                    triggerFireworkExplosion();

                    let fadeOutInterval = setInterval(() => {
                        particleSystem.material.opacity -= 0.05;
                        if (particleSystem.material.opacity <= 0) {
                            particleSystem.material.opacity = 0;
                            clearInterval(fadeOutInterval);
                        }
                    }, 30);

                    setTimeout(() => {
                        let s = 0;
                        const popInterval = setInterval(() => {
                            s += 0.08;
                            cardGroup.scale.set(s, s, s);
                            if (s >= 1.0) {
                                cardGroup.scale.set(1, 1, 1);
                                clearInterval(popInterval);
                                targetCardOpen = 1.0;
                            }
                        }, 20);
                    }, 250);
                    break;
            }
        }

        // --- 9. Animation & Render Loop ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            currentAssembleRatio += (targetAssembleRatio - currentAssembleRatio) * 0.08;
            cardOpenProgress += (targetCardOpen - cardOpenProgress) * 0.05;

            if (coverPivot) {
                coverPivot.rotation.y = -cardOpenProgress * (Math.PI * 0.78);
            }

            const posAttr = particleGeo.attributes.position;
            const positions = posAttr.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                const cx = cakePositions[idx];
                const cy = cakePositions[idx + 1];
                const cz = cakePositions[idx + 2];

                if (targetAssembleRatio <= 1.0) {
                    const dx = dispersedPositions[idx];
                    const dy = dispersedPositions[idx + 1];
                    const dz = dispersedPositions[idx + 2];

                    const wiggle = Math.sin(time * 0.003 + i) * 0.03 * (1 - currentAssembleRatio);

                    positions[idx] = THREE.MathUtils.lerp(dx, cx, currentAssembleRatio) + wiggle;
                    positions[idx + 1] = THREE.MathUtils.lerp(dy, cy, currentAssembleRatio) + wiggle;
                    positions[idx + 2] = THREE.MathUtils.lerp(dz, cz, currentAssembleRatio) + wiggle;
                } else {
                    const ex = explodedPositions[idx];
                    const ey = explodedPositions[idx + 1];
                    const ez = explodedPositions[idx + 2];

                    const factor = currentAssembleRatio - 1.0;
                    positions[idx] = THREE.MathUtils.lerp(cx, ex, factor);
                    positions[idx + 1] = THREE.MathUtils.lerp(cy, ey, factor);
                    positions[idx + 2] = THREE.MathUtils.lerp(cz, ez, factor);
                }
            }
            posAttr.needsUpdate = true;

            particleSystem.rotation.y = time * 0.0003;
            if (candleGroup) candleGroup.rotation.y = time * 0.0003;
            if (flameGroup) flameGroup.rotation.y = time * 0.0003;

            if (cardGroup && currentStep === 4) {
                cardGroup.rotation.y = Math.sin(time * 0.001) * 0.12;
                cardGroup.position.y = 0.3 + Math.sin(time * 0.002) * 0.08;
            }

            if (flameGroup && flameGroup.visible) {
                const fPos = flameGeo.attributes.position.array;
                for (let i = 0; i < fPos.length / 3; i++) {
                    fPos[i * 3 + 1] += 0.002;
                    if (fPos[i * 3 + 1] > 1.15) {
                        fPos[i * 3 + 1] = 0.93;
                    }
                }
                flameGeo.attributes.position.needsUpdate = true;
            }

            updateExplosions();
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Start Application ---
        window.addEventListener('DOMContentLoaded', () => {
            initScene();

            document.getElementById('next-step-btn').addEventListener('click', advanceStep);
            document.getElementById('reset-btn').addEventListener('click', resetAll);

            animate(0);
        });
    </script>
</body>
